openapi: 3.1.0
info:
  title: Kurgu API
  description: >
    Spec-first API (CONVENTIONS.md). The Go strict server and the TypeScript
    client are both generated from this file. Every path is relative to the
    /api/v1 base URL.
  version: 0.1.0
servers:
  - url: /api/v1

# Every operation needs a session cookie unless it says `security: []`.
security:
  - session: []

tags:
  - name: auth
  - name: workspaces
  - name: members
  - name: pipelines
  - name: jobs

paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      description: >
        Starts a session. A wrong email and a wrong password answer the same
        401; repeated failures for one email answer 429 for a while.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
        default: { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [auth]
      description: Changes the password and signs out every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204":
          description: Changed.
        default: { $ref: "#/components/responses/Error" }

  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      operationId: getInvitation
      tags: [members]
      security: []
      responses:
        "200":
          description: What accepting the invitation would do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      operationId: acceptInvitation
      tags: [members]
      security: []
      description: >
        Joins the workspace and signs in. When the invited email already has
        an account, `password` is that account's password; otherwise `name`
        and `password` create the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                name: { type: string, maxLength: 80 }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Joined; the session cookie is set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
          content:
            application/json:
              schema:
                type: object
                required: [user, workspaceId]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  workspaceId: { type: string, format: uuid }
        default: { $ref: "#/components/responses/Error" }

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      responses:
        "200":
          description: The workspaces the caller is a member of.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      description: Creates a workspace with the caller as its owner.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspacePatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listMembers
      tags: [members]
      responses:
        "200":
          description: Members, owners first, then by join date.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeMemberRole
      tags: [members]
      description: Owners only. The last owner cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      tags: [members]
      description: >
        Owners remove anyone; any member may remove themselves (leave). The
        last owner cannot leave.
      responses:
        "204":
          description: Removed.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listInvitations
      tags: [members]
      responses:
        "200":
          description: Pending invitations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      tags: [members]
      description: >
        Invites an email address. Inviting an address that already has a
        pending invitation replaces it. The link is only returned here;
        until SMTP lands, the owner sends it themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, maxLength: 254 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [invitation, url]
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  url:
                    type: string
                    description: Link to the accept page; carries the secret token.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeInvitation
      tags: [members]
      responses:
        "204":
          description: Revoked.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listPipelines
      tags: [pipelines]
      responses:
        "200":
          description: The workspace's pipelines, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [pipelines]
                properties:
                  pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPipeline
      tags: [pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineDefinition" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    get:
      operationId: getPipeline
      tags: [pipelines]
      responses:
        "200":
          description: The pipeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: redefinePipeline
      tags: [pipelines]
      description: >
        Replaces the definition. `version` is the version the caller read; a
        newer stored version answers 409 StaleVersion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, definition]
              properties:
                version: { type: integer, format: int64 }
                definition: { $ref: "#/components/schemas/PipelineDefinition" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePipeline
      tags: [pipelines]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/pause:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: pausePipeline
      tags: [pipelines]
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/resume:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: resumePipeline
      tags: [pipelines]
      responses:
        "200":
          description: Resumed; the next run is the schedule's next firing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: runPipeline
      tags: [pipelines]
      description: Starts a manual run now, whatever the schedule or status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/JobStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The workspace's jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      tags: [jobs]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelJob
      tags: [jobs]
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: kurgu_session

  headers:
    SetSession:
      description: Sets or clears the HttpOnly `kurgu_session` cookie.
      schema: { type: string }

  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: An error, with a stable code from the apperror taxonomy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    Role:
      type: string
      enum: [owner, editor, viewer]
      description: >
        owner: everything, including settings and members. editor: pipelines,
        runs and review. viewer: read only.

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }

    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, email, name, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time }

    Invitation:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    InvitationPreview:
      type: object
      required: [workspaceName, email, role, expiresAt, accountExists]
      properties:
        workspaceName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expiresAt: { type: string, format: date-time }
        accountExists:
          type: boolean
          description: When true, accepting takes that account's password; otherwise a name and a new password.

    WorkspaceInput:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string, maxLength: 80 }
        timezone:
          type: string
          description: IANA timezone name, e.g. Europe/Istanbul.

    WorkspacePatch:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        timezone: { type: string }

    Workspace:
      type: object
      required: [id, name, timezone, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        role:
          $ref: "#/components/schemas/Role"
          description: The caller's role in this workspace.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Language:
      type: string
      enum: [tr, en]

    DeliverableKind:
      type: string
      enum: [video, article]

    VideoSpec:
      type: object
      required: [format, orientation, durationSeconds]
      properties:
        format:
          type: string
          enum: [short, long]
        orientation:
          type: string
          enum: [vertical, horizontal, square]
        durationSeconds: { type: integer, minimum: 10, maximum: 3600 }

    ArticleSpec:
      type: object
      required: [words, translations]
      properties:
        words: { type: integer, minimum: 300, maximum: 6000 }
        translations:
          type: array
          items: { $ref: "#/components/schemas/Language" }

    Outputs:
      type: object
      description: >
        A video, an article, or both. With both, `lead` says which is
        produced first; the other is derived from it.
      properties:
        video: { $ref: "#/components/schemas/VideoSpec" }
        article: { $ref: "#/components/schemas/ArticleSpec" }
        lead: { $ref: "#/components/schemas/DeliverableKind" }

    KnowledgeRef:
      type: object
      required: [documentId]
      properties:
        documentId: { type: string, format: uuid }
        fromPage:
          type: integer
          minimum: 1
          description: Omit both pages for the whole document.
        toPage: { type: integer, minimum: 1 }

    Source:
      type: object
      required: [kind, instructions]
      properties:
        kind:
          type: string
          enum: [prompt, knowledge]
        instructions:
          type: string
          maxLength: 20000
          description: >
            Required for prompt sources, where it acts as the system prompt;
            optional guidance for knowledge sources.
        refs:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeRef" }

    Schedule:
      type: object
      required: [cron, timezone, batch]
      properties:
        cron:
          type: string
          description: Five-field cron expression or descriptor such as @daily.
        timezone:
          type: string
          description: IANA timezone the expression is evaluated in.
        batch:
          type: integer
          minimum: 1
          maximum: 20
          description: Items produced per run.

    PipelineDefinition:
      type: object
      required: [name, language, outputs, source]
      properties:
        name: { type: string, maxLength: 120 }
        language: { $ref: "#/components/schemas/Language" }
        outputs: { $ref: "#/components/schemas/Outputs" }
        source: { $ref: "#/components/schemas/Source" }
        schedule: { $ref: "#/components/schemas/Schedule" }

    Pipeline:
      type: object
      required: [id, workspaceId, version, status, definition, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        status:
          type: string
          enum: [active, paused]
        definition: { $ref: "#/components/schemas/PipelineDefinition" }
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      required: [id, workspaceId, queue, kind, status, attempt, maxAttempts, runAfter, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        queue: { type: string }
        kind: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        runAfter: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
