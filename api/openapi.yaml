openapi: 3.1.0
info:
  title: Ekin API
  description: >
    Spec-first API (CONVENTIONS.md). The Go strict server and the TypeScript
    client are both generated from this file. Every path is relative to the
    /api/v1 base URL.
  version: 0.1.0
servers:
  - url: /api/v1

# Every operation needs a session cookie unless it says `security: []`.
security:
  - session: []

tags:
  - name: auth
  - name: workspaces
  - name: members
  - name: knowledge
  - name: library
  - name: stories
  - name: system
  - name: integrations
  - name: seo
  - name: templates
  - name: voice
  - name: production
  - name: pipelines
  - name: jobs

paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      description: >
        Starts a session. A wrong email and a wrong password answer the same
        401; repeated failures for one email answer 429 for a while.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
        default: { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                emailNotifications:
                  type: boolean
                  description: Review digests by email.
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [auth]
      description: Changes the password and signs out every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204":
          description: Changed.
        default: { $ref: "#/components/responses/Error" }

  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      operationId: getInvitation
      tags: [members]
      security: []
      responses:
        "200":
          description: What accepting the invitation would do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      operationId: acceptInvitation
      tags: [members]
      security: []
      description: >
        Joins the workspace and signs in. When the invited email already has
        an account, `password` is that account's password; otherwise `name`
        and `password` create the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                name: { type: string, maxLength: 80 }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Joined; the session cookie is set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
          content:
            application/json:
              schema:
                type: object
                required: [user, workspaceId]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  workspaceId: { type: string, format: uuid }
        default: { $ref: "#/components/responses/Error" }

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      responses:
        "200":
          description: The workspaces the caller is a member of.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      description: Creates a workspace with the caller as its owner.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspacePatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listMembers
      tags: [members]
      responses:
        "200":
          description: Members, owners first, then by join date.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeMemberRole
      tags: [members]
      description: Owners only. The last owner cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      tags: [members]
      description: >
        Owners remove anyone; any member may remove themselves (leave). The
        last owner cannot leave.
      responses:
        "204":
          description: Removed.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listInvitations
      tags: [members]
      responses:
        "200":
          description: Pending invitations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      tags: [members]
      description: >
        Invites an email address. Inviting an address that already has a
        pending invitation replaces it. The link is only returned here;
        until SMTP lands, the owner sends it themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, maxLength: 254 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [invitation, url]
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  url:
                    type: string
                    description: Link to the accept page; carries the secret token.
                  emailed:
                    type: boolean
                    description: Whether the link was also emailed (SMTP configured).
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeInvitation
      tags: [members]
      responses:
        "204":
          description: Revoked.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listDocuments
      tags: [knowledge]
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [pending, ready, failed] }
        - name: format
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [pdf, txt, md, epub] }
        - $ref: "#/components/parameters/Search"
        - name: limit
          in: query
          description: Documents per page; 500 when omitted.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the knowledge base, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  nextCursor:
                    type: string
                    description: Pass as `cursor` for the next page; absent after the last.
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadDocument
      tags: [knowledge]
      description: >
        Uploads a PDF, TXT, MD or EPUB file (at most 100 MB). Pages are
        extracted in the background; poll the document until its status is
        ready or failed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, maxLength: 200 }
      responses:
        "202":
          description: Stored; extraction queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocument
      tags: [knowledge]
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateDocument
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDocument
      tags: [knowledge]
      description: Refused with 409 while a pipeline references the document.
      responses:
        "204":
          description: Deleted with its file.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/retry:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: retryDocument
      tags: [knowledge]
      description: >-
        Queues a failed or ready document for extraction again (a ready one keeps its pages
        until the new ones replace them).
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/pages:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listDocumentPages
      tags: [knowledge]
      parameters:
        - name: from
          in: query
          schema: { type: integer, minimum: 1 }
        - name: to
          in: query
          description: Inclusive; omit for the end. At most 200 pages per call.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Extracted pages with token estimates.
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentPage" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/contents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentContents
      tags: [knowledge]
      description: >-
        The table of contents the file declares (PDF bookmarks, the EPUB navigation, Markdown
        headings), in document order; empty when it declares none.
      responses:
        "200":
          description: Sections with their page ranges.
          content:
            application/json:
              schema:
                type: object
                required: [sections]
                properties:
                  sections:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentSection" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/file:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentFile
      tags: [knowledge]
      description: The original upload (PDFs display inline in the browser's viewer).
      responses:
        "200":
          description: The file.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/epub+zip:
              schema: { type: string, format: binary }
            application/octet-stream:
              description: TXT and MD originals; the pages endpoint has their text.
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/library/assets:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listLibraryAssets
      tags: [library]
      parameters:
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/LibraryAssetKind" }
        - name: origin
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/LibraryAssetOrigin" }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/LibraryAssetStatus" }
        - name: orientation
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/Orientation" }
        - name: q
          in: query
          description: >-
            Keep assets whose title, tags or description contain this text, compared
            ignoring case, accents and the Turkish dotted and dotless i.
          schema: { type: string, maxLength: 200 }
        - name: archived
          in: query
          description: Include archived assets; they are left out when omitted.
          schema: { type: boolean }
        - name: limit
          in: query
          description: Assets per page; 100 when omitted.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the media library, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items: { $ref: "#/components/schemas/LibraryAsset" }
                  nextCursor:
                    type: string
                    description: Pass as `cursor` for the next page; absent after the last.
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadLibraryAsset
      tags: [library]
      description: >
        Uploads a video (MP4, MOV, M4V or WebM, at most 300 MB and 2 minutes), a photo
        (JPEG, PNG or WebP, at most 25 MB) or a music track (MP3, WAV, FLAC, M4A, AAC or
        Ogg, at most 50 MB and 15 minutes). It is processed in the background; poll the
        asset until its status is ready or failed. The `kind` and `details` parts must come
        before `file`. A file the library already holds is refused with 409.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                kind: { $ref: "#/components/schemas/LibraryAssetKind" }
                details: { $ref: "#/components/schemas/LibraryAssetDetails" }
                file: { type: string, format: binary }
            encoding:
              details:
                contentType: application/json
      responses:
        "202":
          description: Stored; processing queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAsset" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/library/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getLibraryAsset
      tags: [library]
      responses:
        "200":
          description: The asset. Its files are served at `files/main` and `files/poster` below it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAsset" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateLibraryAsset
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryAssetPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAsset" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLibraryAsset
      tags: [library]
      description: Videos that used the asset keep their own copies.
      responses:
        "204":
          description: Deleted with its files.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/library/settings:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getLibrarySettings
      tags: [library]
      responses:
        "200":
          description: Which kinds the workspace saves from its drafts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibrarySettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveLibrarySettings
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibrarySettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibrarySettings" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/library/assets/{assetId}/usages:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: listLibraryAssetUsages
      tags: [library]
      responses:
        "200":
          description: The revisions that used the asset, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [usages]
                properties:
                  usages:
                    type: array
                    items: { $ref: "#/components/schemas/LibraryUsage" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/library/assets/{assetId}/retry:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    post:
      operationId: retryLibraryAsset
      tags: [library]
      description: Queues a failed upload for processing again.
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAsset" }
        default: { $ref: "#/components/responses/Error" }

  /system:
    get:
      operationId: getSystem
      tags: [system]
      description: What this instance can do — tools found, integrations configured.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/Error" }

  /system/credentials:
    get:
      operationId: listCredentials
      tags: [system]
      description: >
        API keys and service settings. Secrets are never returned, only a hint
        of their last characters. Admins only.
      responses:
        "200":
          description: Credentials.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCredentials
      tags: [system]
      description: >
        Sets credentials by key. An empty string removes the saved value, so
        the environment variable applies again. Stored encrypted. Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string, maxLength: 4096 }
      responses:
        "200":
          description: Updated credentials.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Error" }

  /system/profiles:
    get:
      operationId: listProfiles
      tags: [system]
      description: Host profiles (throttling). Admins only.
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [profiles, current]
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/HostProfile" }
                  current:
                    type: string
                    description: The profile this server's worker uses.
        default: { $ref: "#/components/responses/Error" }

  /system/profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
    put:
      operationId: saveProfile
      tags: [system]
      description: Saves a host profile. This server's worker applies it at once, remote workers within a few seconds. Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostProfile" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostProfile" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/notifications:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listNotifications
      tags: [stories]
      parameters:
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [review, failed, published, run]
        - name: limit
          in: query
          description: Notifications per page; 50 when omitted.
          schema: { type: integer, minimum: 1, maximum: 200 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of notifications, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  nextCursor:
                    type: string
                    description: Pass as `cursor` for the next page; absent after the last.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/integrations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getIntegrations
      tags: [integrations]
      responses:
        "200":
          description: Publishing targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integrations" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/integrations/youtube:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: connectYouTube
      tags: [integrations]
      description: Returns the Google consent URL; the browser goes there and comes back to /oauth/youtube/callback.
      responses:
        "200":
          description: Consent URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateYouTube
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privacy]
              properties:
                privacy: { $ref: "#/components/schemas/Privacy" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integrations" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disconnectYouTube
      tags: [integrations]
      responses:
        "204":
          description: Disconnected.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/integrations/blog:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      operationId: saveBlog
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integrations" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBlog
      tags: [integrations]
      responses:
        "204":
          description: Removed.
        default: { $ref: "#/components/responses/Error" }

  /oauth/youtube/callback:
    get:
      operationId: youTubeCallback
      tags: [integrations]
      security: []
      description: Google redirects here; Ekin stores the channel and redirects back to the workspace settings.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Back to the app.
          headers:
            Location:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/seo:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getSEOProfile
      tags: [seo]
      responses:
        "200":
          description: The workspace's SEO context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOProfile" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveSEOProfile
      tags: [seo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SEOProfile" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOProfile" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/seo/openseo:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getOpenSEOStatus
      tags: [seo]
      description: >
        Checks the instance's OpenSEO API key and lists its projects (both
        free). With a key, refreshes call OpenSEO directly; without one
        they go through the host's Claude Code OpenSEO plugin.
      responses:
        "200":
          description: Connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenSEOStatus" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/opportunities:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listOpportunities
      tags: [seo]
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/OpportunityStatus" }
        - name: language
          in: query
          schema: { $ref: "#/components/schemas/Language" }
        - name: q
          in: query
          description: Keep keywords containing this text, compared ignoring case, accents and the Turkish dotted and dotless i.
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          description: Opportunities per page; 1000 when omitted.
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the pool, open first then used then dismissed, best first within each.
          content:
            application/json:
              schema:
                type: object
                required: [opportunities]
                properties:
                  opportunities:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
                  nextCursor:
                    type: string
                    description: Pass as `cursor` for the next page; absent after the last.
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: importOpportunities
      tags: [seo]
      description: Adds keywords (pasted, or exported from OpenSEO); duplicates are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/OpportunityInput" }
      responses:
        "200":
          description: How many were added.
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/opportunities/refresh:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: refreshOpportunities
      tags: [seo]
      description: >
        Asks OpenSEO for new opportunities through the worker's Claude Code
        OpenSEO connection (uses OpenSEO credits).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/opportunities/{opportunityId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: opportunityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateOpportunity
      tags: [seo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, dismissed]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        default: { $ref: "#/components/responses/Error" }

  /voices:
    get:
      operationId: listVoices
      tags: [voice]
      description: >
        The TTS engines of each language (default first) with their voices
        and limits. ElevenLabs lists no voices here: they come from the
        account (getElevenLabsAccount).
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: array
                    items: { $ref: "#/components/schemas/VoiceEngine" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/voice:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getVoiceSettings
      tags: [voice]
      responses:
        "200":
          description: Narration settings per language and the pronunciation dictionary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveVoiceSettings
      tags: [voice]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceSettings" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/production:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspaceProduction
      tags: [production]
      description: >-
        The workspace's production defaults and default template, which
        every pipeline and ad-hoc request takes where it sets nothing, and
        the server's values, which apply where the workspace sets nothing
        either.
      responses:
        "200":
          description: The defaults and the server's values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceProduction" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveWorkspaceProduction
      tags: [production]
      description: >-
        Replaces the workspace's production defaults and default template;
        an absent field goes back to the server's value (no template).
        Stories already planned keep the settings and template they were
        planned with. An unknown templateId is a ValidationFailed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceProductionInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceProduction" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/voice/elevenlabs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getElevenLabsAccount
      tags: [voice]
      description: >
        The ElevenLabs account's voices and text-to-speech models, and its
        character usage when the key may read it. configured is false
        without an API key; error is set when the account could not be read.
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElevenLabsAccount" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/voice/previews:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: previewVoice
      tags: [voice]
      description: >
        Renders a short sample on a worker (tts queue) with the given settings
        and the workspace's pronunciation dictionary. Fetch the audio with the
        returned previewId when the job has finished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, config]
              properties:
                language: { $ref: "#/components/schemas/Language" }
                config: { $ref: "#/components/schemas/VoiceConfig" }
                text: { type: string, maxLength: 400 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [previewId, job]
                properties:
                  previewId: { type: string, format: uuid }
                  job: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/voice/previews/{previewId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: previewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getVoicePreview
      tags: [voice]
      description: The rendered sample; 404 NotFound until it is ready.
      responses:
        "200":
          description: WAV audio.
          content:
            audio/wav:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/templates:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listTemplates
      tags: [templates]
      responses:
        "200":
          description: Built-in templates first, then the workspace's own.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTemplate
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/templates/generate:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: generateTemplate
      tags: [templates]
      description: >
        Has the agent research a YouTube channel on the web and draft a template
        that describes (never copies) its style. The draft appears in the list
        when the job finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, maxLength: 300, description: Channel name or URL. }
                notes: { type: string, maxLength: 2000 }
                kinds:
                  type: array
                  items: { $ref: "#/components/schemas/DeliverableKind" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTemplate
      tags: [templates]
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateTemplate
      tags: [templates]
      description: >-
        Built-ins are read-only (403); duplicate them first. Send the
        `version` you read to refuse overwriting a newer edit (409).
        A template deleted meanwhile answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTemplate
      tags: [templates]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/templates/{templateId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: duplicateTemplate
      tags: [templates]
      responses:
        "201":
          description: The editable copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listStories
      tags: [stories]
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DeliverableStatus" }
        - name: pipelineId
          in: query
          schema: { type: string, format: uuid }
        - name: origin
          in: query
          schema:
            type: string
            enum: [schedule, manual, adhoc]
        - $ref: "#/components/parameters/Search"
        - name: limit
          in: query
          description: Stories per page; 100 when omitted.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: >-
            A page of stories, newest first. `status` filters on the story's
            summary status.
          content:
            application/json:
              schema:
                type: object
                required: [stories]
                properties:
                  stories:
                    type: array
                    items: { $ref: "#/components/schemas/Story" }
                  nextCursor:
                    type: string
                    description: Pass as `cursor` for the next page; absent after the last.
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createStories
      tags: [stories]
      description: >
        Ad-hoc request: a free-text idea plus structured fields. Ideas are
        planned and produced in the background; no pipeline is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdHocInput" }
      responses:
        "202":
          description: Planning queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
    get:
      operationId: getStory
      tags: [stories]
      responses:
        "200":
          description: The story with its deliverables.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteStory
      tags: [stories]
      description: Deletes the story and its files. Refused while a step is running.
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    get:
      operationId: listRevisions
      tags: [stories]
      description: >
        Every revision, oldest first. Artifacts are fetched from
        /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/revisions/{number}/{artifact}
        (supports Range requests; not part of this spec).
      responses:
        "200":
          description: Revisions.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: { $ref: "#/components/schemas/Revision" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/revisions/{number}/annotation:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      operationId: annotateRevision
      tags: [stories]
      description: >
        Saves a person's note on a revision, replacing the one it had, at
        any status. Blank text removes the note. The note is for the team
        and never reaches the agent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationInput" }
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/revisions/{number}/library:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
      - name: number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: listRevisionMedia
      tags: [library]
      description: >
        The stock and music a video revision uses: the Pexels stock its composition shows and
        its composed score, each with the library asset it already is, and what it took from
        the library.
      responses:
        "200":
          description: The revision's media.
          content:
            application/json:
              schema:
                type: object
                required: [media]
                properties:
                  media:
                    type: array
                    items: { $ref: "#/components/schemas/RevisionMedia" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: saveRevisionMedia
      tags: [library]
      description: >
        Saves one of the revision's Pexels stock items or its composed score to the library,
        kept whatever the workspace saves on its own. Saving one the library holds keeps it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  maxLength: 200
                  description: The item's key from the listing.
      responses:
        "200":
          description: The library asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryAsset" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/approve:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: approveDeliverable
      tags: [stories]
      description: Accepts the deliverable. A video gets its final render; then it is published when a target is connected.
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/changes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: requestChanges
      tags: [stories]
      description: Sends the deliverable back to the agent with feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/content:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    get:
      operationId: getDeliverableContent
      tags: [stories]
      description: >
        The editable text of the latest revision: an article's article.md
        (frontmatter and body), or a video's narration and metadata.
      responses:
        "200":
          description: Content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverableContent" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: editDeliverableContent
      tags: [stories]
      description: >
        Saves a reviewer's edit as a new revision. Only a deliverable in
        review can be edited, and `revision` must still be the latest
        (409 Conflict otherwise). Article and metadata edits stay in
        review. An edited narration sends the video back to the agent,
        which keeps the text word for word, narrates it again and
        re-times the visuals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverableEdit" }
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/reject:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: rejectDeliverable
      tags: [stories]
      description: Drops the deliverable (and whatever waits on it).
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/moments:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    get:
      operationId: listMoments
      tags: [stories]
      description: >
        The moments found in a long video that could stand alone as shorts,
        with its narration's sentences to choose more from and the shorts
        limits. When shorts cannot be cut from it (yet), `blocked` says why
        and `sentences` is empty.
      responses:
        "200":
          description: Moments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moments" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addMoment
      tags: [stories]
      description: >
        Adds a moment a person chose. Its start moves to the nearest sentence
        start and its end to the nearest sentence end, and a moment longer
        than the short limit ends at the last sentence that fits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MomentInput" }
      responses:
        "201":
          description: The moment as kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/moments/scan:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: scanMoments
      tags: [stories]
      description: >
        Queues the agent to suggest moments of a live long video. Its new
        suggestions replace its earlier ones; moments a person added or
        adjusted, and those made into shorts, stay. Follow the returned job
        and list the moments when it has succeeded.
      responses:
        "202":
          description: The scan job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/moments/{momentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/MomentId"
    patch:
      operationId: adjustMoment
      tags: [stories]
      description: >
        Moves a suggested moment (snapped to sentences like a new one) or
        renames it. An adjusted moment counts as the person's and survives
        the agent's next suggestions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MomentPatch" }
      responses:
        "200":
          description: The moment as kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Moment" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: discardMoment
      tags: [stories]
      description: Sets a suggested moment aside; it stays listed as discarded.
      responses:
        "204":
          description: Discarded.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/shorts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: makeShorts
      tags: [stories]
      description: >
        Makes a vertical short from each chosen moment of a live long video
        and queues their drafts. Each short speaks its slice of the long
        video's narration. Refused past the shorts-per-video limit or when
        two shorts would come closer than the minimum gap.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShortsInput" }
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    put:
      operationId: pickThumbnail
      tags: [stories]
      description: >
        Picks the thumbnail variant of the latest revision a long video goes
        out with, while it is in review or approved but not yet published.
        0 goes back to the recommended one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant]
              properties:
                variant: { type: integer, minimum: 0, maximum: 4 }
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/thumbnails/{n}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
      - name: n
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 4 }
    patch:
      operationId: editThumbnail
      tags: [stories]
      description: >
        Changes the words of thumbnail variant n of a long video in review,
        without the agent: a new revision whose thumbnails alone are drawn
        again, in seconds. `revision` must still be the latest (409
        Conflict otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, text]
              properties:
                revision: { type: integer, minimum: 1 }
                text: { type: string, maxLength: 60 }
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/retry:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: retryDeliverable
      tags: [stories]
      description: Resumes a failed deliverable at the step that failed.
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/publish:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: publishDeliverable
      tags: [stories]
      description: Publishes an approved, ready deliverable now.
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listPipelines
      tags: [pipelines]
      responses:
        "200":
          description: The workspace's pipelines, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [pipelines]
                properties:
                  pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPipeline
      tags: [pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineDefinition" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/upcoming-runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listUpcomingRuns
      tags: [pipelines]
      description: >
        The scheduled runs of the workspace's active pipelines from now
        until `days` days ahead, soonest first. Each pipeline's list starts
        with its planned next run, which may already be due.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 14, default: 7 }
      responses:
        "200":
          description: The upcoming runs.
          content:
            application/json:
              schema:
                type: object
                required: [until, runs]
                properties:
                  until:
                    type: string
                    format: date-time
                    description: End of the window (exclusive).
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/UpcomingRun" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    get:
      operationId: getPipeline
      tags: [pipelines]
      responses:
        "200":
          description: The pipeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: redefinePipeline
      tags: [pipelines]
      description: >
        Replaces the definition. `version` is the version the caller read; a
        newer stored version answers 409 StaleVersion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, definition]
              properties:
                version: { type: integer, format: int64 }
                definition: { $ref: "#/components/schemas/PipelineDefinition" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePipeline
      tags: [pipelines]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/pause:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: pausePipeline
      tags: [pipelines]
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/resume:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: resumePipeline
      tags: [pipelines]
      responses:
        "200":
          description: Resumed; the next run is the schedule's next firing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: runPipeline
      tags: [pipelines]
      description: Starts a manual run now, whatever the schedule or status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/JobStatus" }
        - name: kind
          in: query
          required: false
          style: form
          explode: true
          description: Keep the requests with a job of one of these kinds.
          schema:
            type: array
            maxItems: 20
            items: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          description: Requests per page; 100 when omitted.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: >-
            Every job of a page of the workspace's requests (traces, latest
            first by their newest matching job), newest first. A status or kind
            keeps the requests with a matching job; limit counts requests.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  nextCursor:
                    type: string
                    description: Pass as `cursor` for the next page; absent after the last.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      tags: [jobs]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelJob
      tags: [jobs]
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ekin_session

  headers:
    SetSession:
      description: Sets or clears the HttpOnly `ekin_session` cookie.
      schema: { type: string }

  parameters:
    Cursor:
      name: cursor
      in: query
      description: >-
        Continue a listing after the page that returned this `nextCursor`.
        Keyset paging: rows added meanwhile are neither skipped nor repeated.
      schema: { type: string, maxLength: 512 }
    Search:
      name: q
      in: query
      description: >-
        Keep rows whose title contains this text, compared ignoring case,
        accents and the Turkish dotted and dotless i.
      schema: { type: string, maxLength: 200 }
    StoryId:
      name: storyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliverableId:
      name: deliverableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MomentId:
      name: momentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: An error, with a stable code from the apperror taxonomy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    Role:
      type: string
      enum: [owner, editor, viewer]
      description: >
        owner: everything, including settings and members. editor: pipelines,
        runs and review. viewer: read only.

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }

    User:
      type: object
      required: [id, email, name, isAdmin, emailNotifications, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        isAdmin:
          type: boolean
          description: Runs the instance (host profiles, system settings). The first account.
        emailNotifications: { type: boolean }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, email, name, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time }

    Invitation:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    InvitationPreview:
      type: object
      required: [workspaceName, email, role, expiresAt, accountExists]
      properties:
        workspaceName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expiresAt: { type: string, format: date-time }
        accountExists:
          type: boolean
          description: When true, accepting takes that account's password; otherwise a name and a new password.

    Document:
      type: object
      required: [id, title, filename, format, size, status, pageCount, tokens, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        filename: { type: string }
        format:
          type: string
          enum: [pdf, txt, md, epub]
        size: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending, ready, failed]
        pageCount: { type: integer }
        tokens:
          type: integer
          description: Estimated tokens of all pages (about ±20%).
        failure:
          type: string
          description: Why extraction failed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentPage:
      type: object
      required: [number, text, words, tokens]
      properties:
        number: { type: integer }
        text: { type: string }
        words: { type: integer }
        tokens: { type: integer }

    DocumentSection:
      type: object
      required: [level, title, fromPage, toPage]
      properties:
        level:
          type: integer
          description: 1 for a top-level entry (a chapter), deeper entries count up.
        title: { type: string }
        fromPage: { type: integer }
        toPage:
          type: integer
          description: The page before the next entry at this level or above, or the last page.

    LibraryAssetKind:
      type: string
      enum: [music, video, photo]

    LibraryAssetOrigin:
      type: string
      description: generated is a score the agent composed, pexels stock it fetched, upload a person's file.
      enum: [generated, pexels, upload]

    LibraryAssetStatus:
      type: string
      enum: [processing, ready, failed]

    Orientation:
      type: string
      enum: [portrait, landscape, square]

    LibraryCredit:
      type: object
      description: The attribution a video using the asset gives; all empty for none.
      required: [author, url, licence]
      properties:
        author: { type: string, maxLength: 300 }
        url: { type: string, maxLength: 300 }
        licence: { type: string, maxLength: 300 }

    LibraryAssetDetails:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          description: On upload, empty takes the file name.
        description: { type: string, maxLength: 2000 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
        mood:
          type: string
          maxLength: 100
          description: Music only.
        tempo:
          type: integer
          minimum: 0
          maximum: 300
          description: Beats per minute, music only; 0 for unknown.
        credit: { $ref: "#/components/schemas/LibraryCredit" }

    LibrarySettings:
      type: object
      description: >-
        Which kinds the workspace saves to its library when a video draft finishes, all off by
        default. Saved items are provisional until the video is approved or rejected; then only
        what its last revision used is kept.
      required: [music, video, photo]
      properties:
        music:
          type: boolean
          description: Scores the agent composes.
        video:
          type: boolean
          description: Pexels clips the agent uses.
        photo:
          type: boolean
          description: Pexels photos the agent uses.

    RevisionMedia:
      type: object
      required: [key, kind, source, title]
      properties:
        key:
          type: string
          description: >-
            Names the item within the revision: "pexels:video:123", "music.js" for the composed
            score, or "library:<id>" for an item taken from the library.
        kind: { $ref: "#/components/schemas/LibraryAssetKind" }
        source:
          type: string
          enum: [pexels, composed, library]
        title: { type: string }
        author: { type: string }
        asset:
          $ref: "#/components/schemas/LibraryAsset"
          description: The library asset it is or came from; absent when the library does not hold it.

    LibraryUsage:
      type: object
      required: [storyId, deliverableId, revision, usedAt]
      properties:
        storyId: { type: string, format: uuid }
        storyTitle:
          type: string
          description: Absent when the story was deleted since.
        deliverableId: { type: string, format: uuid }
        revision: { type: integer }
        usedAt: { type: string, format: date-time }

    LibraryAssetPatch:
      type: object
      properties:
        details:
          $ref: "#/components/schemas/LibraryAssetDetails"
          description: Replaces every editable detail.
        archived:
          type: boolean
          description: Archived assets are kept but no longer offered to new drafts.

    LibraryAsset:
      type: object
      required: [id, kind, origin, status, title, description, tags, credit, filename, size, hasPoster, usageCount, provisional, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/LibraryAssetKind" }
        origin: { $ref: "#/components/schemas/LibraryAssetOrigin" }
        status: { $ref: "#/components/schemas/LibraryAssetStatus" }
        title: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        mood: { type: string }
        tempo: { type: integer }
        credit: { $ref: "#/components/schemas/LibraryCredit" }
        filename:
          type: string
          description: The uploaded file's name; empty for assets the agent made.
        size:
          type: integer
          format: int64
          description: Bytes of the file received.
        width: { type: integer }
        height: { type: integer }
        orientation: { $ref: "#/components/schemas/Orientation" }
        durationSeconds:
          type: number
          description: Videos and uploaded music.
        hasPoster: { type: boolean }
        usageCount:
          type: integer
          description: How many videos used it; reuse is unlimited.
        provisional:
          type: boolean
          description: >-
            Saved from a draft whose video is not yet decided; it is deleted then unless that
            video's last revision used it, another video used it, or a person kept it (editing
            it keeps it).
        sourceUrl:
          type: string
          description: The Pexels page it came from.
        originalUrl:
          type: string
          description: The original Pexels file the stored one was cut from.
        failure:
          type: string
          description: Why processing failed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }

    DeliverableStatus:
      type: string
      enum: [waiting, queued, drafting, rendering, review, finalizing, ready, publishing, published, rejected, failed]

    FeedbackScope:
      type: string
      enum: [all, script, voice, visuals, music, metadata, thumbnail]
      description: >-
        What a note is about. thumbnail (a long video's thumbnail variants):
        when every note of a round is about them, the agent changes only the
        thumbnails and the video is not rendered again.

    FeedbackNoteInput:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 5000 }
        scope: { $ref: "#/components/schemas/FeedbackScope" }
        atSeconds:
          type: number
          format: double
          minimum: 0
          description: Video position the note refers to.

    FeedbackInput:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          minItems: 1
          maxItems: 20
          description: The notes of one review round, sent together.
          items: { $ref: "#/components/schemas/FeedbackNoteInput" }

    FeedbackNote:
      type: object
      required: [text, scope]
      properties:
        text: { type: string }
        scope: { $ref: "#/components/schemas/FeedbackScope" }
        atSeconds: { type: number, format: double }

    Feedback:
      type: object
      required: [notes, at]
      properties:
        notes:
          type: array
          description: Untimed notes first, then the timed ones by time.
          items: { $ref: "#/components/schemas/FeedbackNote" }
        by:
          type: string
          format: uuid
          description: The person who wrote the feedback.
        at: { type: string, format: date-time }

    Publication:
      type: object
      required: [url, externalId, at]
      properties:
        url: { type: string }
        externalId: { type: string }
        at: { type: string, format: date-time }

    Deliverable:
      type: object
      required: [id, kind, role, language, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DeliverableKind" }
        role:
          type: string
          enum: [lead, derived, translation]
        sourceId: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/Language" }
        status: { $ref: "#/components/schemas/DeliverableStatus" }
        revision:
          type: integer
          description: Latest revision number; 0 before the first draft.
        video: { $ref: "#/components/schemas/VideoSpec" }
        article: { $ref: "#/components/schemas/ArticleSpec" }
        pendingFeedback: { $ref: "#/components/schemas/Feedback" }
        failure: { type: string }
        failedStep: { type: string }
        approvedAt: { type: string, format: date-time }
        stage:
          type: string
          enum: [script, video]
          description: >-
            Videos only. script while the video's script waits for a person's
            approval (being drafted, in review, or sent back with changes);
            video otherwise.
        scriptApprovedAt:
          type: string
          format: date-time
          description: When a person approved the video's script, for stories that review scripts first.
        publication: { $ref: "#/components/schemas/Publication" }
        measured:
          $ref: "#/components/schemas/Measures"
          description: What the latest revision came out as; absent until something was measured.
        clip:
          $ref: "#/components/schemas/Clip"
          description: For a short cut from a long video (sourceId), the span of the long video's narration it speaks.
        thumbnail:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            Long videos: the thumbnail variant a person picked; absent when
            nobody did, and the recommended one goes out.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Clip:
      type: object
      description: A span of a long video's narration, in seconds of its audio.
      required: [startSeconds, endSeconds]
      properties:
        startSeconds: { type: number, format: double }
        endSeconds: { type: number, format: double }

    Moment:
      type: object
      description: A span of a long video that could stand alone as a short.
      required: [id, sourceId, clip, hook, reason, score, origin, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid, description: The long video it was found in. }
        clip: { $ref: "#/components/schemas/Clip" }
        hook: { type: string, description: The short's working title. }
        reason: { type: string, description: Why the moment stands alone. }
        score: { type: integer, minimum: 0, maximum: 100, description: The agent's ranking; 0 for a person's moments. }
        origin:
          type: string
          enum: [agent, manual]
        status:
          type: string
          enum: [suggested, made, discarded]
        shortId: { type: string, format: uuid, description: The short made from it. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Sentence:
      type: object
      required: [text, startSeconds, endSeconds]
      properties:
        text: { type: string }
        startSeconds: { type: number, format: double }
        endSeconds: { type: number, format: double }

    ShortsLimits:
      type: object
      description: The server's limits on cutting shorts from long videos (EKIN_SHORTS_*).
      required: [sourceMinSeconds, sourceMaxSeconds, clipMinSeconds, clipMaxSeconds, maxPerVideo, minGapSeconds]
      properties:
        sourceMinSeconds: { type: number, format: double }
        sourceMaxSeconds: { type: number, format: double }
        clipMinSeconds: { type: number, format: double }
        clipMaxSeconds: { type: number, format: double }
        maxPerVideo: { type: integer }
        minGapSeconds: { type: number, format: double }

    Moments:
      type: object
      required: [moments, sentences, limits, shorts]
      properties:
        blocked:
          type: string
          description: Why shorts cannot be cut from this video (yet); absent when they can.
        moments:
          type: array
          description: In the order they come in the video.
          items: { $ref: "#/components/schemas/Moment" }
        sentences:
          type: array
          items: { $ref: "#/components/schemas/Sentence" }
        limits: { $ref: "#/components/schemas/ShortsLimits" }
        shorts:
          type: integer
          description: Shorts already made from this video.

    MomentInput:
      type: object
      required: [startSeconds, endSeconds]
      properties:
        startSeconds: { type: number, format: double, minimum: 0 }
        endSeconds: { type: number, format: double, minimum: 0 }
        hook: { type: string, maxLength: 120 }

    MomentPatch:
      type: object
      description: Give both times to move the moment, a hook to rename it, or both.
      properties:
        startSeconds: { type: number, format: double, minimum: 0 }
        endSeconds: { type: number, format: double, minimum: 0 }
        hook: { type: string, maxLength: 120 }

    ShortsInput:
      type: object
      required: [momentIds]
      properties:
        momentIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }

    Measures:
      type: object
      description: >
        What a revision came out as, as opposed to the pipeline's targets.
        Each field is absent until measured.
      properties:
        durationSeconds:
          type: number
          format: double
          description: Length of the rendered video.
        words:
          type: integer
          description: Words in a video's narration or an article's body.
        narrator: { $ref: "#/components/schemas/Narrator" }

    Narrator:
      type: object
      description: >
        The voice that read a video's narration. Names come from GET /voices
        (and, for ElevenLabs, the workspace's ElevenLabs voices and models).
      required: [engine]
      properties:
        engine: { type: string, description: "TTS engine ID: okur, ema, kokoro, elevenlabs." }
        voice: { type: string, description: "Voice ID; absent for an engine with one voice, or when not recorded." }
        model: { type: string, description: "ElevenLabs model ID." }

    Story:
      type: object
      required: [id, origin, language, title, angle, keywords, status, deliverables, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        origin:
          type: string
          enum: [schedule, manual, adhoc]
        language: { $ref: "#/components/schemas/Language" }
        title: { type: string }
        angle: { type: string }
        keywords:
          type: array
          items: { type: string }
        instructions: { type: string }
        refs:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeRef" }
        templateName: { type: string, description: The house style the story was produced with. }
        keyword: { type: string, description: Target search keyword (SEO pipelines). }
        production: { $ref: "#/components/schemas/Production" }
        status: { $ref: "#/components/schemas/DeliverableStatus" }
        deliverables:
          type: array
          items: { $ref: "#/components/schemas/Deliverable" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Revision:
      type: object
      required: [number, artifacts, notes, createdAt]
      properties:
        number: { type: integer }
        feedback: { $ref: "#/components/schemas/Feedback" }
        artifacts:
          type: array
          description: Artifact names, e.g. preview.mp4, final.mp4, poster.jpg, script.md, metadata.json, article.md.
          items: { type: string }
        notes:
          type: string
          description: The agent's summary of this revision.
        editedBy:
          type: string
          format: uuid
          description: The person who edited this revision in place; absent when the agent made it.
        stage:
          type: string
          enum: [script]
          description: script when the revision holds only a video's script (no narration audio or render yet); absent otherwise.
        measured: { $ref: "#/components/schemas/Measures" }
        annotation: { $ref: "#/components/schemas/Annotation" }
        thumbnails: { $ref: "#/components/schemas/Thumbnails" }
        createdAt: { type: string, format: date-time }

    Thumbnails:
      type: object
      description: >-
        A long video's designed thumbnail variants, each served as the
        revision artifact thumb-<n>.jpg (all of them as thumbnails.zip).
      required: [recommended, variants]
      properties:
        recommended: { type: integer, minimum: 1, maximum: 4 }
        variants:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/Thumbnail" }

    Thumbnail:
      type: object
      required: [n, concept, text]
      properties:
        n: { type: integer, minimum: 1, maximum: 4 }
        concept:
          type: string
          description: The idea behind the variant, e.g. frame, type or contrast.
        text: { type: string, description: The words on the thumbnail, at most 5. }
        stillSeconds:
          type: number
          format: double
          description: The video time of the still it uses, if any.

    Annotation:
      type: object
      description: A person's note on a revision; absent when it has none.
      required: [text, by, at]
      properties:
        text: { type: string, maxLength: 4000 }
        by: { type: string, format: uuid }
        at: { type: string, format: date-time }

    AnnotationInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 4000
          description: The note; blank removes it.

    VideoMetadataContent:
      type: object
      required: [title, description, tags]
      properties:
        title: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        tags:
          type: array
          items: { type: string }

    DeliverableContent:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        article: { type: string, description: "article.md: YAML frontmatter, then the Markdown body." }
        narration: { type: string, description: The spoken text; paragraphs separated by blank lines. }
        metadata: { $ref: "#/components/schemas/VideoMetadataContent" }

    DeliverableEdit:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, description: The revision the edit was made on. }
        article: { type: string }
        narration: { type: string }
        metadata: { $ref: "#/components/schemas/VideoMetadataContent" }

    DraftEffort:
      type: string
      enum: [low, medium, high, xhigh, max]
      description: >-
        How hard the authoring agent thinks while drafting (Claude Code's
        --effort). Absent on a pipeline or request: the workspace default
        (Settings › Production), then the server's (EKIN_CLAUDE_EFFORT, then
        Claude Code's own), resolved when a story is planned so remote
        workers draft with it too; on ServerProduction, absent means Claude
        Code's own.

    MediaSource:
      type: string
      enum: [fresh, library, mixed]
      description: >-
        Where a video's media of one kind comes from. fresh: the agent
        composes music and searches Pexels for stock (what a kind set nowhere
        does). library: only the workspace's library. mixed: the library
        first, fresh when nothing there fits.

    MediaSources:
      type: object
      description: >-
        Each kind's media source. Absent: the workspace default (Settings ›
        Production), then fresh.
      properties:
        music: { $ref: "#/components/schemas/MediaSource" }
        video: { $ref: "#/components/schemas/MediaSource" }
        photo: { $ref: "#/components/schemas/MediaSource" }

    Production:
      type: object
      description: >-
        How stories are made, set per pipeline or request, or as a
        workspace's defaults. Every absent field takes the layer below: a
        pipeline's or request's the workspace default (Settings ›
        Production), the workspace's the server's. Self-review rounds travel
        beside it (selfReviewRounds).
      properties:
        draftModel:
          type: string
          maxLength: 74
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}(\[[0-9a-z]{1,8}\])?$'
          description: >-
            Claude model the agent drafts and revises with: a model id
            (claude-sonnet-5-5) or an alias (sonnet). Absent: the workspace
            default (Settings › Production), then the server's (System ›
            Credentials, then EKIN_CLAUDE_MODEL, then Claude Code's own).
            Resolved when a story is planned, so every worker, remote ones
            included, drafts with the model shown here.
        draftEffort: { $ref: "#/components/schemas/DraftEffort" }
        previewQuality:
          type: string
          enum: ["360p", "540p", "720p", "1080p"]
          description: >-
            Resolution of the review render (the short side of a 1080p frame).
            When it is at least the final quality, at the final frame rate,
            approving reuses the preview as the final video instead of
            rendering again. Absent: the workspace default (Settings ›
            Production), then the server's (the host profile's preview
            scale).
        finalQuality:
          type: string
          enum: ["720p", "1080p", "1440p", "2160p"]
          description: >-
            Resolution of the final render after approval (the short side of a
            1080p frame). Absent: the workspace default (Settings ›
            Production), then the server's (the host profile's final scale).
        previewFps:
          type: integer
          enum: [15, 24, 30]
          description: >-
            Frame rate of the review render. Fewer frames render faster and
            look choppier; a preview below the final frame rate is never
            reused as the final video. Absent: the workspace default
            (Settings › Production), then the server's (the host profile's).
        finalFps:
          type: integer
          enum: [30, 60]
          description: >-
            Frame rate of the final render; 60 takes about twice as long.
            Absent: the workspace default (Settings › Production), then the
            server's (the host profile's).
        reviewAt:
          type: string
          enum: [video, script]
          description: >-
            When a person first reviews a video. video: the rendered preview.
            script: the script, narration text and metadata first; approving
            them has the agent build the video, which is then reviewed as
            usual. On a pipeline or request, script needs a video output; a
            workspace default of script leaves stories without a video
            reviewing as usual. Absent: the workspace default (Settings ›
            Production), then video.
        media: { $ref: "#/components/schemas/MediaSources" }
        thumbnails:
          type: integer
          minimum: 0
          maximum: 4
          description: >-
            How many designed thumbnail variants a long video gets, for the
            reviewer to pick from; 0 keeps a frame grabbed from the video.
            Shorts always keep that frame. Absent: the workspace default
            (Settings › Production), then 3.

    SelfReviewRounds:
      type: integer
      minimum: 0
      maximum: 5
      description: >-
        Rounds of self-review per draft, at most: a fresh agent reviews the
        draft and the author fixes what it reports, until it passes or the
        rounds run out. 0 turns it off. Absent: the server's 1.

    WorkspaceProductionInput:
      type: object
      required: [defaults]
      properties:
        defaults: { $ref: "#/components/schemas/Production" }
        selfReviewRounds: { $ref: "#/components/schemas/SelfReviewRounds" }
        templateId:
          type: string
          format: uuid
          description: >-
            Default house style: the template (a built-in or one of the
            workspace's) that stories use where their pipeline or request
            neither picks a template nor sets noTemplate. Absent: no
            template.

    WorkspaceProduction:
      type: object
      required: [defaults, server]
      properties:
        defaults: { $ref: "#/components/schemas/Production" }
        selfReviewRounds: { $ref: "#/components/schemas/SelfReviewRounds" }
        templateId:
          type: string
          format: uuid
          description: >-
            Default house style for stories whose pipeline or request
            neither picks a template nor sets noTemplate; absent for none.
            It may name a template deleted since, which then means none.
        server: { $ref: "#/components/schemas/ServerProduction" }

    ServerProduction:
      type: object
      description: >-
        What stories get where neither the workspace nor a pipeline or
        request sets a value.
      required: [draftModelSource, previewHeight, finalHeight, previewFps, finalFps, profile]
      properties:
        draftModel:
          type: string
          description: >-
            The model drafts run with on every worker, remote ones included
            (stories take it when planned); absent when Claude Code picks
            its own, which on a remote worker is that machine's
            EKIN_CLAUDE_MODEL or Claude Code's default.
        draftModelSource:
          type: string
          enum: [settings, env, unset]
          description: >-
            Where draftModel comes from: settings (System › Credentials), env
            (EKIN_CLAUDE_MODEL) or unset (Claude Code's own default).
        draftEffort: { $ref: "#/components/schemas/DraftEffort" }
        previewHeight:
          type: integer
          description: Short side of the review render of a 1080p composition, in pixels.
        finalHeight:
          type: integer
          description: Short side of the final render of a 1080p composition, in pixels.
        previewFps: { type: integer }
        finalFps: { type: integer }
        profile:
          type: string
          description: The host profile the render values come from (System › Hosts).

    AdHocInput:
      type: object
      required: [idea, count, language, outputs]
      properties:
        idea:
          type: string
          maxLength: 5000
          description: Free text — what you want made.
        count: { type: integer, minimum: 1, maximum: 10 }
        language: { $ref: "#/components/schemas/Language" }
        outputs: { $ref: "#/components/schemas/Outputs" }
        style:
          type: string
          maxLength: 2000
          description: Tone, visual style, audience notes.
        refs:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeRef" }
        templateId:
          type: string
          format: uuid
          description: >-
            House style for the stories. Absent: the workspace's default
            template (Settings › Production), unless noTemplate is set.
        noTemplate:
          type: boolean
          description: >-
            True makes the stories use no template, whatever the workspace's
            default; templateId must then be absent (both is a
            ValidationFailed). Absent or false: templateId, else the
            workspace's default.
        voice: { $ref: "#/components/schemas/VoiceOverride" }
        selfReviewRounds:
          type: integer
          minimum: 0
          maximum: 5
          description: >-
            Rounds of self-review per draft, at most: a fresh agent reviews the
            draft and the author fixes what it reports, until it passes or the
            rounds run out. 0 turns it off; omitted means the workspace
            default (Settings › Production), then 1.
        production: { $ref: "#/components/schemas/Production" }

    SystemCheck:
      type: object
      required: [name, ok, detail]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }

    SystemStatus:
      type: object
      required: [version, checks]
      properties:
        version: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/SystemCheck" }

    Credential:
      type: object
      required: [key, label, env, secret, source]
      properties:
        key: { type: string }
        label: { type: string }
        env: { type: string, description: The environment variable used when nothing is saved. }
        secret: { type: boolean }
        source:
          type: string
          enum: [settings, env, default, unset]
        value:
          type: string
          description: The value for non-secrets; a hint such as ••••9876 for secrets.

    HostProfile:
      type: object
      required: [name, concurrency, heavyExclusive, cooldownSeconds, paused, cpuLimit, renderDuty, renderChunks, previewScale, finalScale]
      properties:
        name: { type: string }
        concurrency:
          type: object
          description: Jobs per queue (control, agent, tts, render, extract, io); 0 or missing = not served.
          additionalProperties: { type: integer, minimum: 0, maximum: 8 }
        heavyExclusive:
          type: boolean
          description: Only one job of the heavy queues at a time.
        heavyQueues:
          type: array
          description: >-
            The queues heavyExclusive covers. Always set in responses; omitted on save
            means the default (agent, tts, render).
          items:
            type: string
            enum: [control, agent, tts, render, extract, io]
        nice:
          type: integer
          minimum: 0
          maximum: 19
          description: >-
            Scheduling priority of the job processes, 0 (normal) to 19 (lowest), so the
            host's own work comes first. Applied live; the Ekin server keeps its priority.
        cooldownSeconds: { type: integer, minimum: 0, maximum: 3600 }
        paused: { type: boolean }
        cpuLimit:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Percent of the host's CPUs that job processes (agent, browser, encoder,
            speech) may use together; 0 means no limit, otherwise 10 to 100. Applied
            live on Linux hosts; the Ekin server itself is never limited.
        renderDuty:
          type: number
          minimum: 0.05
          maximum: 1
          description: Share of time spent rendering; 0.25 renders four times slower to spare the CPU.
        renderChunks: { type: integer, minimum: 1, maximum: 16 }
        previewScale: { type: number, minimum: 0.25, maximum: 1 }
        finalScale: { type: number, minimum: 0.25, maximum: 2 }
        previewFps:
          type: integer
          enum: [15, 24, 30]
          description: Frame rate of review renders. Absent on input keeps 30.
        finalFps:
          type: integer
          enum: [30, 60]
          description: Frame rate of final renders. Absent on input keeps 30.

    Notification:
      type: object
      required: [id, kind, title, detail, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [review, failed, published, run]
        title: { type: string }
        detail: { type: string }
        storyId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Privacy:
      type: string
      enum: [private, unlisted, public]

    YouTubeIntegration:
      type: object
      required: [configured, connected]
      properties:
        configured:
          type: boolean
          description: The server has Google OAuth credentials.
        connected: { type: boolean }
        channelId: { type: string }
        channelTitle: { type: string }
        privacy: { $ref: "#/components/schemas/Privacy" }
        connectedAt: { type: string, format: date-time }

    BlogTarget:
      type: object
      required: [kind, contentDir, publicDir, siteUrl, pathTemplate, defaultLocale, author, draft, hasToken]
      properties:
        kind:
          type: string
          enum: [github, dir]
        repo: { type: string, description: "owner/name (github)" }
        branch: { type: string }
        dir: { type: string, description: Absolute path of a local checkout (dir). }
        contentDir: { type: string, description: "e.g. marketing/src/content/blog" }
        publicDir: { type: string }
        siteUrl: { type: string }
        pathTemplate: { type: string, description: "{locale} is empty for the default locale, otherwise the post's locale and a slash (e.g. 'tr/')" }
        defaultLocale: { type: string }
        author: { type: string }
        draft: { type: boolean, description: Publish with draft true for a last manual pass. }
        hasToken: { type: boolean }

    BlogInput:
      type: object
      required: [kind, contentDir]
      properties:
        kind:
          type: string
          enum: [github, dir]
        repo: { type: string }
        branch: { type: string }
        dir: { type: string }
        contentDir: { type: string }
        publicDir: { type: string }
        siteUrl: { type: string }
        pathTemplate: { type: string }
        defaultLocale: { type: string }
        author: { type: string }
        draft: { type: boolean }
        token:
          type: string
          description: GitHub token with contents write access. Omit to keep the stored one.

    Integrations:
      type: object
      required: [youtube]
      properties:
        youtube: { $ref: "#/components/schemas/YouTubeIntegration" }
        blog: { $ref: "#/components/schemas/BlogTarget" }

    Voice:
      type: object
      required: [id, label, accent, gender]
      properties:
        id: { type: string }
        label: { type: string }
        accent: { type: string }
        gender: { type: string }

    VoiceEngine:
      type: object
      required: [id, language, name, voices, minSpeed, maxSpeed, hasSeed, hasQuality, cloud, defaultVoice]
      properties:
        id:
          type: string
          enum: [okur, ema, kokoro, elevenlabs]
        language: { $ref: "#/components/schemas/Language" }
        name: { type: string }
        voices:
          type: array
          items: { $ref: "#/components/schemas/Voice" }
        minSpeed: { type: number, format: double }
        maxSpeed: { type: number, format: double }
        hasSeed: { type: boolean, description: "Seed picks another take of the same text." }
        hasQuality: { type: boolean, description: "Model precision: fp32 best, int8 fastest (Kokoro)." }
        cloud: { type: boolean, description: "A paid API that needs a key; the narration text is sent to it." }
        defaultVoice: { type: string }

    ElevenLabsSettings:
      type: object
      required: [model, stability, similarityBoost, style, speakerBoost]
      properties:
        model: { type: string, description: "Model ID, e.g. eleven_multilingual_v2." }
        stability: { type: number, format: double, minimum: 0, maximum: 1 }
        similarityBoost: { type: number, format: double, minimum: 0, maximum: 1 }
        style: { type: number, format: double, minimum: 0, maximum: 1 }
        speakerBoost: { type: boolean }

    ElevenLabsVoice:
      type: object
      required: [id, name, category, labels, languages]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        previewUrl: { type: string }
        languages:
          type: array
          description: Languages the voice is verified for.
          items: { type: string }

    ElevenLabsModel:
      type: object
      required: [id, name, description, languages, maxCharacters, costMultiplier, canStyle, canSpeakerBoost]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        languages:
          type: array
          items: { type: string }
        maxCharacters: { type: integer }
        costMultiplier: { type: number, format: double, description: "Credits per character." }
        canStyle: { type: boolean }
        canSpeakerBoost: { type: boolean }

    ElevenLabsAccount:
      type: object
      required: [configured, voices, models]
      properties:
        configured: { type: boolean }
        error: { type: string }
        tier: { type: string }
        characterCount: { type: integer }
        characterLimit: { type: integer }
        voices:
          type: array
          items: { $ref: "#/components/schemas/ElevenLabsVoice" }
        models:
          type: array
          items: { $ref: "#/components/schemas/ElevenLabsModel" }

    VoiceConfig:
      type: object
      required: [voice, speed, sentencePause, paragraphPause]
      properties:
        engine:
          type: string
          enum: [okur, ema, kokoro, elevenlabs]
          description: Omitted means the language's default engine.
        voice: { type: string }
        speed: { type: number, format: double }
        sentencePause: { type: number, format: double, minimum: 0, maximum: 3 }
        paragraphPause: { type: number, format: double, minimum: 0, maximum: 3 }
        seed: { type: integer, minimum: 0, maximum: 1000000 }
        quality:
          type: string
          enum: [fp32, fp16, int8]
        elevenlabs: { $ref: "#/components/schemas/ElevenLabsSettings" }

    VoiceSettings:
      type: object
      required: [languages, lexicon]
      properties:
        languages:
          type: object
          description: Config per language code (tr, en).
          additionalProperties: { $ref: "#/components/schemas/VoiceConfig" }
        lexicon:
          type: object
          description: >
            Pronunciation dictionary per language: written word → how to say
            it. Captions keep the written word.
          additionalProperties:
            type: object
            additionalProperties: { type: string }

    VoiceOverride:
      type: object
      description: >
        Overrides the workspace engine, voice or speed for one pipeline or
        request. A voice without an engine selects the engine that has it.
      properties:
        engine:
          type: string
          enum: [okur, ema, kokoro, elevenlabs]
        voice: { type: string }
        speed: { type: number, format: double }

    TemplateFont:
      type: string
      enum: [Inter, Lora, Nunito, Oswald, Caveat, JetBrains Mono, Fraunces, Instrument Serif]

    TemplateInput:
      type: object
      required: [name, kinds, guide]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        inspiration: { type: string, maxLength: 300, description: What the style draws on; for people, never shown on screen. }
        kinds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DeliverableKind" }
        guide: { type: string, maxLength: 20000, description: Markdown style guide. }
        palette:
          type: array
          maxItems: 8
          items: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        headingFont: { $ref: "#/components/schemas/TemplateFont" }
        bodyFont: { $ref: "#/components/schemas/TemplateFont" }
        musicMood: { type: string, maxLength: 300 }
        version:
          type: integer
          format: int64
          description: >-
            On update, the version the caller read; a newer stored version
            answers 409 StaleVersion instead of overwriting someone else's
            edit. Omitted, the update applies to whatever is stored.

    Template:
      type: object
      required: [id, name, description, inspiration, kinds, guide, palette, headingFont, bodyFont, musicMood, source, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        inspiration: { type: string }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/DeliverableKind" }
        guide: { type: string }
        palette:
          type: array
          items: { type: string }
        headingFont: { $ref: "#/components/schemas/TemplateFont" }
        bodyFont: { $ref: "#/components/schemas/TemplateFont" }
        musicMood: { type: string }
        source:
          type: string
          enum: [builtin, custom, generated]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }

    SEOProfile:
      type: object
      required: [domain, country, language, topics]
      properties:
        domain: { type: string, description: "e.g. example.com" }
        country: { type: string, description: Two-letter code such as TR. }
        language: { $ref: "#/components/schemas/Language" }
        topics: { type: string, description: What to look for. }
        projectId: { type: string, description: The OpenSEO project direct refreshes are scoped to. }
        seeds:
          type: array
          maxItems: 5
          description: Seed keywords for research_keywords (about 54 credits each). Empty uses the topics.
          items: { type: string }
        competitors:
          type: array
          maxItems: 3
          description: Domains whose ranking keywords to mine (about 100–300 credits each).
          items: { type: string }
        maxDifficulty: { type: integer, minimum: 0, maximum: 100, description: "Keyword difficulty ceiling; 0 means 50." }
        minVolume: { type: integer, minimum: 0, description: Monthly searches floor. }
        estimatedCredits:
          type: integer
          readOnly: true
          description: The most a direct refresh with this profile should spend.

    OpenSEOProject:
      type: object
      required: [id, name, locationCode, languageCode]
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        locationCode: { type: integer }
        languageCode: { type: string }
        url: { type: string }
        organization: { type: string }

    OpenSEOStatus:
      type: object
      required: [configured, projects]
      properties:
        configured: { type: boolean, description: An API key is set. }
        email: { type: string }
        creditsRemaining: { type: number, format: double }
        projects:
          type: array
          items: { $ref: "#/components/schemas/OpenSEOProject" }
        error: { type: string }

    OpportunityStatus:
      type: string
      enum: [open, used, dismissed]

    OpportunityInput:
      type: object
      required: [keyword]
      properties:
        keyword: { type: string, maxLength: 120 }
        language: { $ref: "#/components/schemas/Language" }
        volume: { type: integer, minimum: 0 }
        difficulty: { type: integer, minimum: -1, maximum: 100 }
        intent: { type: string }
        note: { type: string, maxLength: 1000 }

    Opportunity:
      type: object
      required: [id, keyword, language, volume, difficulty, intent, note, source, status, score, createdAt]
      properties:
        id: { type: string, format: uuid }
        keyword: { type: string }
        language: { $ref: "#/components/schemas/Language" }
        volume: { type: integer }
        difficulty: { type: integer, description: "-1 when unknown" }
        intent: { type: string }
        note: { type: string }
        source: { type: string }
        status: { $ref: "#/components/schemas/OpportunityStatus" }
        storyId: { type: string, format: uuid }
        score: { type: number }
        createdAt: { type: string, format: date-time }

    WorkspaceInput:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string, maxLength: 80 }
        timezone:
          type: string
          description: IANA timezone name, e.g. Europe/London.

    WorkspacePatch:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        timezone: { type: string }

    Workspace:
      type: object
      required: [id, name, timezone, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        role:
          $ref: "#/components/schemas/Role"
          description: The caller's role in this workspace.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Language:
      type: string
      enum: [tr, en]

    DeliverableKind:
      type: string
      enum: [video, article]

    VideoSpec:
      type: object
      required: [format, orientation, durationSeconds]
      properties:
        format:
          type: string
          enum: [short, long]
        orientation:
          type: string
          enum: [vertical, horizontal, square]
        durationSeconds: { type: integer, minimum: 10, maximum: 3600 }
        shortsPerVideo:
          type: integer
          minimum: 0
          maximum: 20
          description: >-
            Long videos only: how many vertical shorts to cut from each video
            once it is live, from the moments the agent finds (capped by the
            server's EKIN_SHORTS_MAX_PER_VIDEO). Absent or 0 for none.

    ArticleSpec:
      type: object
      required: [words, translations]
      properties:
        words: { type: integer, minimum: 300, maximum: 6000 }
        translations:
          type: array
          items: { $ref: "#/components/schemas/Language" }

    Outputs:
      type: object
      description: >
        A video, an article, or both. With both, `lead` says which is
        produced first; the other is derived from it.
      properties:
        video: { $ref: "#/components/schemas/VideoSpec" }
        article: { $ref: "#/components/schemas/ArticleSpec" }
        lead: { $ref: "#/components/schemas/DeliverableKind" }

    KnowledgeRef:
      type: object
      required: [documentId]
      properties:
        documentId: { type: string, format: uuid }
        fromPage:
          type: integer
          minimum: 1
          description: Omit both pages for the whole document.
        toPage: { type: integer, minimum: 1 }

    Source:
      type: object
      required: [kind, instructions]
      properties:
        kind:
          type: string
          enum: [prompt, knowledge, seo]
          description: >
            prompt: ideas from the instructions. knowledge: ideas and facts from
            the referenced pages. seo: each idea targets one open keyword
            opportunity from the workspace's pool.
        instructions:
          type: string
          maxLength: 20000
          description: >
            Required for prompt sources, where it acts as the system prompt;
            optional guidance for knowledge sources.
        refs:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeRef" }

    Schedule:
      type: object
      required: [cron, timezone, batch]
      properties:
        cron:
          type: string
          description: Five-field cron expression or descriptor such as @daily.
        timezone:
          type: string
          description: IANA timezone the expression is evaluated in.
        batch:
          type: integer
          minimum: 1
          maximum: 20
          description: Items produced per run.

    PipelineDefinition:
      type: object
      required: [name, language, outputs, source]
      properties:
        name: { type: string, maxLength: 120 }
        language: { $ref: "#/components/schemas/Language" }
        outputs: { $ref: "#/components/schemas/Outputs" }
        source: { $ref: "#/components/schemas/Source" }
        schedule: { $ref: "#/components/schemas/Schedule" }
        templateId:
          type: string
          format: uuid
          description: >-
            House style for this pipeline's stories. Absent: the workspace's
            default template (Settings › Production) at each run, unless
            noTemplate is set.
        noTemplate:
          type: boolean
          description: >-
            True makes this pipeline's stories use no template, whatever the
            workspace's default; templateId must then be absent (both is a
            ValidationFailed). Absent or false: templateId, else the
            workspace's default. Read back only when true.
        voice: { $ref: "#/components/schemas/VoiceOverride" }
        selfReviewRounds:
          type: integer
          minimum: 0
          maximum: 5
          description: >-
            Rounds of self-review per draft, at most: a fresh agent reviews the
            draft and the author fixes what it reports, until it passes or the
            rounds run out. 0 turns it off; omitted means the workspace
            default (Settings › Production), then 1.
        production: { $ref: "#/components/schemas/Production" }

    Pipeline:
      type: object
      required: [id, workspaceId, version, status, definition, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        status:
          type: string
          enum: [active, paused]
        definition: { $ref: "#/components/schemas/PipelineDefinition" }
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpcomingRun:
      type: object
      required: [pipelineId, at, count]
      properties:
        pipelineId: { type: string, format: uuid }
        at: { type: string, format: date-time }
        count: { type: integer, description: Items the run produces. }

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      required: [id, workspaceId, traceId, queue, kind, status, attempt, maxAttempts, runAfter, createdAt, updatedAt, subject]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        traceId:
          type: string
          format: uuid
          description: The request this job belongs to (its first job's id); every job a request causes shares it.
        queue: { type: string }
        kind: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        runAfter: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt:
          type: string
          format: date-time
          description: When the latest attempt began; absent until the job first runs.
        finishedAt: { type: string, format: date-time }
        subject: { $ref: "#/components/schemas/JobSubject" }
    JobSubject:
      type: object
      description: What the job works on, as named in its payload.
      properties:
        storyId: { type: string, format: uuid }
        deliverableId: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        final: { type: boolean, description: A final (not preview) render. }
