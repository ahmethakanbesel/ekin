openapi: 3.1.0
info:
  title: Kurgu API
  description: >
    Spec-first API (CONVENTIONS.md). The Go strict server and the TypeScript
    client are both generated from this file. Every path is relative to the
    /api/v1 base URL.
  version: 0.1.0
servers:
  - url: /api/v1

# Every operation needs a session cookie unless it says `security: []`.
security:
  - session: []

tags:
  - name: auth
  - name: workspaces
  - name: members
  - name: knowledge
  - name: stories
  - name: system
  - name: integrations
  - name: seo
  - name: templates
  - name: voice
  - name: pipelines
  - name: jobs

paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      description: >
        Starts a session. A wrong email and a wrong password answer the same
        401; repeated failures for one email answer 429 for a while.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
        default: { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                emailNotifications:
                  type: boolean
                  description: Review digests by email.
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      operationId: changePassword
      tags: [auth]
      description: Changes the password and signs out every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204":
          description: Changed.
        default: { $ref: "#/components/responses/Error" }

  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      operationId: getInvitation
      tags: [members]
      security: []
      responses:
        "200":
          description: What accepting the invitation would do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        default: { $ref: "#/components/responses/Error" }

  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      operationId: acceptInvitation
      tags: [members]
      security: []
      description: >
        Joins the workspace and signs in. When the invited email already has
        an account, `password` is that account's password; otherwise `name`
        and `password` create the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                name: { type: string, maxLength: 80 }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Joined; the session cookie is set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSession" }
          content:
            application/json:
              schema:
                type: object
                required: [user, workspaceId]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  workspaceId: { type: string, format: uuid }
        default: { $ref: "#/components/responses/Error" }

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      responses:
        "200":
          description: The workspaces the caller is a member of.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      description: Creates a workspace with the caller as its owner.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspacePatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listMembers
      tags: [members]
      responses:
        "200":
          description: Members, owners first, then by join date.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeMemberRole
      tags: [members]
      description: Owners only. The last owner cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      tags: [members]
      description: >
        Owners remove anyone; any member may remove themselves (leave). The
        last owner cannot leave.
      responses:
        "204":
          description: Removed.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listInvitations
      tags: [members]
      responses:
        "200":
          description: Pending invitations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      tags: [members]
      description: >
        Invites an email address. Inviting an address that already has a
        pending invitation replaces it. The link is only returned here;
        until SMTP lands, the owner sends it themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, maxLength: 254 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [invitation, url]
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  url:
                    type: string
                    description: Link to the accept page; carries the secret token.
                  emailed:
                    type: boolean
                    description: Whether the link was also emailed (SMTP configured).
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeInvitation
      tags: [members]
      responses:
        "204":
          description: Revoked.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listDocuments
      tags: [knowledge]
      responses:
        "200":
          description: The knowledge base, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadDocument
      tags: [knowledge]
      description: >
        Uploads a PDF, TXT, MD or EPUB file (at most 100 MB). Pages are
        extracted in the background; poll the document until its status is
        ready or failed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, maxLength: 200 }
      responses:
        "202":
          description: Stored; extraction queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocument
      tags: [knowledge]
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateDocument
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDocument
      tags: [knowledge]
      description: Refused with 409 while a pipeline references the document.
      responses:
        "204":
          description: Deleted with its file.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/retry:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: retryDocument
      tags: [knowledge]
      description: >-
        Queues a failed or ready document for extraction again (a ready one keeps its pages
        until the new ones replace them).
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/pages:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listDocumentPages
      tags: [knowledge]
      parameters:
        - name: from
          in: query
          schema: { type: integer, minimum: 1 }
        - name: to
          in: query
          description: Inclusive; omit for the end. At most 200 pages per call.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Extracted pages with token estimates.
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentPage" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/contents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentContents
      tags: [knowledge]
      description: >-
        The table of contents the file declares (PDF bookmarks, the EPUB navigation, Markdown
        headings), in document order; empty when it declares none.
      responses:
        "200":
          description: Sections with their page ranges.
          content:
            application/json:
              schema:
                type: object
                required: [sections]
                properties:
                  sections:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentSection" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/documents/{documentId}/file:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentFile
      tags: [knowledge]
      description: The original upload (PDFs display inline in the browser's viewer).
      responses:
        "200":
          description: The file.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/epub+zip:
              schema: { type: string, format: binary }
            application/octet-stream:
              description: TXT and MD originals; the pages endpoint has their text.
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /system:
    get:
      operationId: getSystem
      tags: [system]
      description: What this instance can do — tools found, integrations configured.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/Error" }

  /system/credentials:
    get:
      operationId: listCredentials
      tags: [system]
      description: >
        API keys and service settings. Secrets are never returned, only a hint
        of their last characters. Admins only.
      responses:
        "200":
          description: Credentials.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCredentials
      tags: [system]
      description: >
        Sets credentials by key. An empty string removes the saved value, so
        the environment variable applies again. Stored encrypted. Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string, maxLength: 4096 }
      responses:
        "200":
          description: Updated credentials.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Error" }

  /system/profiles:
    get:
      operationId: listProfiles
      tags: [system]
      description: Host profiles (throttling). Admins only.
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [profiles, current]
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/HostProfile" }
                  current:
                    type: string
                    description: The profile this server's worker uses.
        default: { $ref: "#/components/responses/Error" }

  /system/profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
    put:
      operationId: saveProfile
      tags: [system]
      description: Saves a host profile. This server's worker applies it at once, remote workers within a few seconds. Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostProfile" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostProfile" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/notifications:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listNotifications
      tags: [stories]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Latest notifications, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/integrations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getIntegrations
      tags: [integrations]
      responses:
        "200":
          description: Publishing targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integrations" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/integrations/youtube:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: connectYouTube
      tags: [integrations]
      description: Returns the Google consent URL; the browser goes there and comes back to /oauth/youtube/callback.
      responses:
        "200":
          description: Consent URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateYouTube
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privacy]
              properties:
                privacy: { $ref: "#/components/schemas/Privacy" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integrations" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disconnectYouTube
      tags: [integrations]
      responses:
        "204":
          description: Disconnected.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/integrations/blog:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      operationId: saveBlog
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integrations" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBlog
      tags: [integrations]
      responses:
        "204":
          description: Removed.
        default: { $ref: "#/components/responses/Error" }

  /oauth/youtube/callback:
    get:
      operationId: youTubeCallback
      tags: [integrations]
      security: []
      description: Google redirects here; Kurgu stores the channel and redirects back to the workspace settings.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Back to the app.
          headers:
            Location:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/seo:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getSEOProfile
      tags: [seo]
      responses:
        "200":
          description: The workspace's SEO context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOProfile" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveSEOProfile
      tags: [seo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SEOProfile" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOProfile" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/seo/openseo:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getOpenSEOStatus
      tags: [seo]
      description: >
        Checks the instance's OpenSEO API key and lists its projects (both
        free). With a key, refreshes call OpenSEO directly; without one
        they go through the host's Claude Code OpenSEO plugin.
      responses:
        "200":
          description: Connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenSEOStatus" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/opportunities:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listOpportunities
      tags: [seo]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OpportunityStatus" }
      responses:
        "200":
          description: Open first, best first.
          content:
            application/json:
              schema:
                type: object
                required: [opportunities]
                properties:
                  opportunities:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: importOpportunities
      tags: [seo]
      description: Adds keywords (pasted, or exported from OpenSEO); duplicates are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/OpportunityInput" }
      responses:
        "200":
          description: How many were added.
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/opportunities/refresh:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: refreshOpportunities
      tags: [seo]
      description: >
        Asks OpenSEO for new opportunities through the worker's Claude Code
        OpenSEO connection (uses OpenSEO credits).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/opportunities/{opportunityId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: opportunityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateOpportunity
      tags: [seo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, dismissed]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        default: { $ref: "#/components/responses/Error" }

  /voices:
    get:
      operationId: listVoices
      tags: [voice]
      description: >
        The TTS engines of each language (default first) with their voices
        and limits. ElevenLabs lists no voices here: they come from the
        account (getElevenLabsAccount).
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: array
                    items: { $ref: "#/components/schemas/VoiceEngine" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/voice:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getVoiceSettings
      tags: [voice]
      responses:
        "200":
          description: Narration settings per language and the pronunciation dictionary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveVoiceSettings
      tags: [voice]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceSettings" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/voice/elevenlabs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getElevenLabsAccount
      tags: [voice]
      description: >
        The ElevenLabs account's voices and text-to-speech models, and its
        character usage when the key may read it. configured is false
        without an API key; error is set when the account could not be read.
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElevenLabsAccount" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/voice/previews:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: previewVoice
      tags: [voice]
      description: >
        Renders a short sample on a worker (tts queue) with the given settings
        and the workspace's pronunciation dictionary. Fetch the audio with the
        returned previewId when the job has finished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, config]
              properties:
                language: { $ref: "#/components/schemas/Language" }
                config: { $ref: "#/components/schemas/VoiceConfig" }
                text: { type: string, maxLength: 400 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [previewId, job]
                properties:
                  previewId: { type: string, format: uuid }
                  job: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/voice/previews/{previewId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: previewId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getVoicePreview
      tags: [voice]
      description: The rendered sample; 404 NotFound until it is ready.
      responses:
        "200":
          description: WAV audio.
          content:
            audio/wav:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/templates:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listTemplates
      tags: [templates]
      responses:
        "200":
          description: Built-in templates first, then the workspace's own.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTemplate
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/templates/generate:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: generateTemplate
      tags: [templates]
      description: >
        Has the agent research a YouTube channel on the web and draft a template
        that describes (never copies) its style. The draft appears in the list
        when the job finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, maxLength: 300, description: Channel name or URL. }
                notes: { type: string, maxLength: 2000 }
                kinds:
                  type: array
                  items: { $ref: "#/components/schemas/DeliverableKind" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTemplate
      tags: [templates]
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateTemplate
      tags: [templates]
      description: Built-ins are read-only (403); duplicate them first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTemplate
      tags: [templates]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/templates/{templateId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: duplicateTemplate
      tags: [templates]
      responses:
        "201":
          description: The editable copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listStories
      tags: [stories]
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DeliverableStatus" }
        - name: pipelineId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Stories, newest first. `status` filters on the story's summary status.
          content:
            application/json:
              schema:
                type: object
                required: [stories]
                properties:
                  stories:
                    type: array
                    items: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createStories
      tags: [stories]
      description: >
        Ad-hoc request: a free-text idea plus structured fields. Ideas are
        planned and produced in the background; no pipeline is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdHocInput" }
      responses:
        "202":
          description: Planning queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
    get:
      operationId: getStory
      tags: [stories]
      responses:
        "200":
          description: The story with its deliverables.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteStory
      tags: [stories]
      description: Deletes the story and its files. Refused while a step is running.
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    get:
      operationId: listRevisions
      tags: [stories]
      description: >
        Every revision, oldest first. Artifacts are fetched from
        /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/revisions/{number}/{artifact}
        (supports Range requests; not part of this spec).
      responses:
        "200":
          description: Revisions.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: { $ref: "#/components/schemas/Revision" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/approve:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: approveDeliverable
      tags: [stories]
      description: Accepts the deliverable. A video gets its final render; then it is published when a target is connected.
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/changes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: requestChanges
      tags: [stories]
      description: Sends the deliverable back to the agent with feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/content:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    get:
      operationId: getDeliverableContent
      tags: [stories]
      description: >
        The editable text of the latest revision: an article's article.md
        (frontmatter and body), or a video's narration and metadata.
      responses:
        "200":
          description: Content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverableContent" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: editDeliverableContent
      tags: [stories]
      description: >
        Saves a reviewer's edit as a new revision. Only a deliverable in
        review can be edited, and `revision` must still be the latest
        (409 Conflict otherwise). Article and metadata edits stay in
        review. An edited narration sends the video back to the agent,
        which keeps the text word for word, narrates it again and
        re-times the visuals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverableEdit" }
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/reject:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: rejectDeliverable
      tags: [stories]
      description: Drops the deliverable (and whatever waits on it).
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/retry:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: retryDeliverable
      tags: [stories]
      description: Resumes a failed deliverable at the step that failed.
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/stories/{storyId}/deliverables/{deliverableId}/publish:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/StoryId"
      - $ref: "#/components/parameters/DeliverableId"
    post:
      operationId: publishDeliverable
      tags: [stories]
      description: Publishes an approved, ready deliverable now.
      responses:
        "200":
          description: The updated story.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listPipelines
      tags: [pipelines]
      responses:
        "200":
          description: The workspace's pipelines, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [pipelines]
                properties:
                  pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPipeline
      tags: [pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineDefinition" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    get:
      operationId: getPipeline
      tags: [pipelines]
      responses:
        "200":
          description: The pipeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: redefinePipeline
      tags: [pipelines]
      description: >
        Replaces the definition. `version` is the version the caller read; a
        newer stored version answers 409 StaleVersion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, definition]
              properties:
                version: { type: integer, format: int64 }
                definition: { $ref: "#/components/schemas/PipelineDefinition" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePipeline
      tags: [pipelines]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/pause:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: pausePipeline
      tags: [pipelines]
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/resume:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: resumePipeline
      tags: [pipelines]
      responses:
        "200":
          description: Resumed; the next run is the schedule's next firing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/pipelines/{pipelineId}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PipelineId"
    post:
      operationId: runPipeline
      tags: [pipelines]
      description: Starts a manual run now, whatever the schedule or status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/JobStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: >-
            Every job of the workspace's latest requests (traces, ordered by their
            newest job), newest first. A status keeps the requests with a job in
            one of them; limit counts requests.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      tags: [jobs]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelJob
      tags: [jobs]
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: kurgu_session

  headers:
    SetSession:
      description: Sets or clears the HttpOnly `kurgu_session` cookie.
      schema: { type: string }

  parameters:
    StoryId:
      name: storyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliverableId:
      name: deliverableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: An error, with a stable code from the apperror taxonomy.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    Role:
      type: string
      enum: [owner, editor, viewer]
      description: >
        owner: everything, including settings and members. editor: pipelines,
        runs and review. viewer: read only.

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }

    User:
      type: object
      required: [id, email, name, isAdmin, emailNotifications, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        isAdmin:
          type: boolean
          description: Runs the instance (host profiles, system settings). The first account.
        emailNotifications: { type: boolean }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, email, name, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time }

    Invitation:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    InvitationPreview:
      type: object
      required: [workspaceName, email, role, expiresAt, accountExists]
      properties:
        workspaceName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expiresAt: { type: string, format: date-time }
        accountExists:
          type: boolean
          description: When true, accepting takes that account's password; otherwise a name and a new password.

    Document:
      type: object
      required: [id, title, filename, format, size, status, pageCount, tokens, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        filename: { type: string }
        format:
          type: string
          enum: [pdf, txt, md, epub]
        size: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending, ready, failed]
        pageCount: { type: integer }
        tokens:
          type: integer
          description: Estimated tokens of all pages (about ±20%).
        failure:
          type: string
          description: Why extraction failed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentPage:
      type: object
      required: [number, text, words, tokens]
      properties:
        number: { type: integer }
        text: { type: string }
        words: { type: integer }
        tokens: { type: integer }

    DocumentSection:
      type: object
      required: [level, title, fromPage, toPage]
      properties:
        level:
          type: integer
          description: 1 for a top-level entry (a chapter), deeper entries count up.
        title: { type: string }
        fromPage: { type: integer }
        toPage:
          type: integer
          description: The page before the next entry at this level or above, or the last page.

    DeliverableStatus:
      type: string
      enum: [waiting, queued, drafting, rendering, review, finalizing, ready, publishing, published, rejected, failed]

    FeedbackScope:
      type: string
      enum: [all, script, voice, visuals, music, metadata]

    FeedbackInput:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 5000 }
        scope: { $ref: "#/components/schemas/FeedbackScope" }
        atSeconds:
          type: number
          format: double
          minimum: 0
          description: Video position the feedback refers to.

    Feedback:
      type: object
      required: [text, scope, at]
      properties:
        text: { type: string }
        scope: { $ref: "#/components/schemas/FeedbackScope" }
        atSeconds: { type: number, format: double }
        at: { type: string, format: date-time }

    Publication:
      type: object
      required: [url, externalId, at]
      properties:
        url: { type: string }
        externalId: { type: string }
        at: { type: string, format: date-time }

    Deliverable:
      type: object
      required: [id, kind, role, language, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DeliverableKind" }
        role:
          type: string
          enum: [lead, derived, translation]
        sourceId: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/Language" }
        status: { $ref: "#/components/schemas/DeliverableStatus" }
        revision:
          type: integer
          description: Latest revision number; 0 before the first draft.
        video: { $ref: "#/components/schemas/VideoSpec" }
        article: { $ref: "#/components/schemas/ArticleSpec" }
        pendingFeedback: { $ref: "#/components/schemas/Feedback" }
        failure: { type: string }
        failedStep: { type: string }
        approvedAt: { type: string, format: date-time }
        publication: { $ref: "#/components/schemas/Publication" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Story:
      type: object
      required: [id, origin, language, title, angle, keywords, status, deliverables, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        origin:
          type: string
          enum: [schedule, manual, adhoc]
        language: { $ref: "#/components/schemas/Language" }
        title: { type: string }
        angle: { type: string }
        keywords:
          type: array
          items: { type: string }
        instructions: { type: string }
        refs:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeRef" }
        templateName: { type: string, description: The house style the story was produced with. }
        keyword: { type: string, description: Target search keyword (SEO pipelines). }
        status: { $ref: "#/components/schemas/DeliverableStatus" }
        deliverables:
          type: array
          items: { $ref: "#/components/schemas/Deliverable" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Revision:
      type: object
      required: [number, artifacts, notes, createdAt]
      properties:
        number: { type: integer }
        feedback: { $ref: "#/components/schemas/Feedback" }
        artifacts:
          type: array
          description: Artifact names, e.g. preview.mp4, final.mp4, poster.jpg, script.md, metadata.json, article.md.
          items: { type: string }
        notes:
          type: string
          description: The agent's summary of this revision.
        editedBy:
          type: string
          format: uuid
          description: The person who edited this revision in place; absent when the agent made it.
        createdAt: { type: string, format: date-time }

    VideoMetadataContent:
      type: object
      required: [title, description, tags]
      properties:
        title: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        tags:
          type: array
          items: { type: string }

    DeliverableContent:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        article: { type: string, description: "article.md: YAML frontmatter, then the Markdown body." }
        narration: { type: string, description: The spoken text; paragraphs separated by blank lines. }
        metadata: { $ref: "#/components/schemas/VideoMetadataContent" }

    DeliverableEdit:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, description: The revision the edit was made on. }
        article: { type: string }
        narration: { type: string }
        metadata: { $ref: "#/components/schemas/VideoMetadataContent" }

    AdHocInput:
      type: object
      required: [idea, count, language, outputs]
      properties:
        idea:
          type: string
          maxLength: 5000
          description: Free text — what you want made.
        count: { type: integer, minimum: 1, maximum: 10 }
        language: { $ref: "#/components/schemas/Language" }
        outputs: { $ref: "#/components/schemas/Outputs" }
        style:
          type: string
          maxLength: 2000
          description: Tone, visual style, audience notes.
        refs:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeRef" }
        templateId:
          type: string
          format: uuid
          description: House style for the stories.
        voice: { $ref: "#/components/schemas/VoiceOverride" }

    SystemCheck:
      type: object
      required: [name, ok, detail]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }

    SystemStatus:
      type: object
      required: [version, checks]
      properties:
        version: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/SystemCheck" }

    Credential:
      type: object
      required: [key, label, env, secret, source]
      properties:
        key: { type: string }
        label: { type: string }
        env: { type: string, description: The environment variable used when nothing is saved. }
        secret: { type: boolean }
        source:
          type: string
          enum: [settings, env, default, unset]
        value:
          type: string
          description: The value for non-secrets; a hint such as ••••9876 for secrets.

    HostProfile:
      type: object
      required: [name, concurrency, heavyExclusive, cooldownSeconds, paused, cpuLimit, renderDuty, renderChunks, previewScale, finalScale]
      properties:
        name: { type: string }
        concurrency:
          type: object
          description: Jobs per queue (control, agent, tts, render, extract, io); 0 or missing = not served.
          additionalProperties: { type: integer, minimum: 0, maximum: 8 }
        heavyExclusive:
          type: boolean
          description: Only one heavy job (agent, tts, render) at a time.
        cooldownSeconds: { type: integer, minimum: 0, maximum: 3600 }
        paused: { type: boolean }
        cpuLimit:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Percent of the host's CPUs that job processes (agent, browser, encoder,
            speech) may use together; 0 means no limit, otherwise 10 to 100. Applied
            live on Linux hosts; the Kurgu server itself is never limited.
        renderDuty:
          type: number
          minimum: 0.05
          maximum: 1
          description: Share of time spent rendering; 0.25 renders four times slower to spare the CPU.
        renderChunks: { type: integer, minimum: 1, maximum: 16 }
        previewScale: { type: number, minimum: 0.25, maximum: 1 }
        finalScale: { type: number, minimum: 0.25, maximum: 2 }

    Notification:
      type: object
      required: [id, kind, title, detail, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [review, failed, published, run]
        title: { type: string }
        detail: { type: string }
        storyId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Privacy:
      type: string
      enum: [private, unlisted, public]

    YouTubeIntegration:
      type: object
      required: [configured, connected]
      properties:
        configured:
          type: boolean
          description: The server has Google OAuth credentials.
        connected: { type: boolean }
        channelId: { type: string }
        channelTitle: { type: string }
        privacy: { $ref: "#/components/schemas/Privacy" }
        connectedAt: { type: string, format: date-time }

    BlogTarget:
      type: object
      required: [kind, contentDir, publicDir, siteUrl, pathTemplate, defaultLocale, author, draft, hasToken]
      properties:
        kind:
          type: string
          enum: [github, dir]
        repo: { type: string, description: "owner/name (github)" }
        branch: { type: string }
        dir: { type: string, description: Absolute path of a local checkout (dir). }
        contentDir: { type: string, description: "e.g. marketing/src/content/blog" }
        publicDir: { type: string }
        siteUrl: { type: string }
        pathTemplate: { type: string, description: "{locale} is empty for the default locale, otherwise 'en/'" }
        defaultLocale: { type: string }
        author: { type: string }
        draft: { type: boolean, description: Publish with draft true for a last manual pass. }
        hasToken: { type: boolean }

    BlogInput:
      type: object
      required: [kind, contentDir]
      properties:
        kind:
          type: string
          enum: [github, dir]
        repo: { type: string }
        branch: { type: string }
        dir: { type: string }
        contentDir: { type: string }
        publicDir: { type: string }
        siteUrl: { type: string }
        pathTemplate: { type: string }
        defaultLocale: { type: string }
        author: { type: string }
        draft: { type: boolean }
        token:
          type: string
          description: GitHub token with contents write access. Omit to keep the stored one.

    Integrations:
      type: object
      required: [youtube]
      properties:
        youtube: { $ref: "#/components/schemas/YouTubeIntegration" }
        blog: { $ref: "#/components/schemas/BlogTarget" }

    Voice:
      type: object
      required: [id, label, accent, gender]
      properties:
        id: { type: string }
        label: { type: string }
        accent: { type: string }
        gender: { type: string }

    VoiceEngine:
      type: object
      required: [id, language, name, voices, minSpeed, maxSpeed, hasSeed, hasQuality, cloud, defaultVoice]
      properties:
        id:
          type: string
          enum: [okur, ema, kokoro, elevenlabs]
        language: { $ref: "#/components/schemas/Language" }
        name: { type: string }
        voices:
          type: array
          items: { $ref: "#/components/schemas/Voice" }
        minSpeed: { type: number, format: double }
        maxSpeed: { type: number, format: double }
        hasSeed: { type: boolean, description: "Seed picks another take of the same text." }
        hasQuality: { type: boolean, description: "Model precision: fp32 best, int8 fastest (Kokoro)." }
        cloud: { type: boolean, description: "A paid API that needs a key; the narration text is sent to it." }
        defaultVoice: { type: string }

    ElevenLabsSettings:
      type: object
      required: [model, stability, similarityBoost, style, speakerBoost]
      properties:
        model: { type: string, description: "Model ID, e.g. eleven_multilingual_v2." }
        stability: { type: number, format: double, minimum: 0, maximum: 1 }
        similarityBoost: { type: number, format: double, minimum: 0, maximum: 1 }
        style: { type: number, format: double, minimum: 0, maximum: 1 }
        speakerBoost: { type: boolean }

    ElevenLabsVoice:
      type: object
      required: [id, name, category, labels, languages]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        previewUrl: { type: string }
        languages:
          type: array
          description: Languages the voice is verified for.
          items: { type: string }

    ElevenLabsModel:
      type: object
      required: [id, name, description, languages, maxCharacters, costMultiplier, canStyle, canSpeakerBoost]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        languages:
          type: array
          items: { type: string }
        maxCharacters: { type: integer }
        costMultiplier: { type: number, format: double, description: "Credits per character." }
        canStyle: { type: boolean }
        canSpeakerBoost: { type: boolean }

    ElevenLabsAccount:
      type: object
      required: [configured, voices, models]
      properties:
        configured: { type: boolean }
        error: { type: string }
        tier: { type: string }
        characterCount: { type: integer }
        characterLimit: { type: integer }
        voices:
          type: array
          items: { $ref: "#/components/schemas/ElevenLabsVoice" }
        models:
          type: array
          items: { $ref: "#/components/schemas/ElevenLabsModel" }

    VoiceConfig:
      type: object
      required: [voice, speed, sentencePause, paragraphPause]
      properties:
        engine:
          type: string
          enum: [okur, ema, kokoro, elevenlabs]
          description: Omitted means the language's default engine.
        voice: { type: string }
        speed: { type: number, format: double }
        sentencePause: { type: number, format: double, minimum: 0, maximum: 3 }
        paragraphPause: { type: number, format: double, minimum: 0, maximum: 3 }
        seed: { type: integer, minimum: 0, maximum: 1000000 }
        quality:
          type: string
          enum: [fp32, fp16, int8]
        elevenlabs: { $ref: "#/components/schemas/ElevenLabsSettings" }

    VoiceSettings:
      type: object
      required: [languages, lexicon]
      properties:
        languages:
          type: object
          description: Config per language code (tr, en).
          additionalProperties: { $ref: "#/components/schemas/VoiceConfig" }
        lexicon:
          type: object
          description: >
            Pronunciation dictionary per language: written word → how to say
            it. Captions keep the written word.
          additionalProperties:
            type: object
            additionalProperties: { type: string }

    VoiceOverride:
      type: object
      description: >
        Overrides the workspace engine, voice or speed for one pipeline or
        request. A voice without an engine selects the engine that has it.
      properties:
        engine:
          type: string
          enum: [okur, ema, kokoro, elevenlabs]
        voice: { type: string }
        speed: { type: number, format: double }

    TemplateFont:
      type: string
      enum: [Inter, Lora, Nunito, Oswald, Caveat, JetBrains Mono]

    TemplateInput:
      type: object
      required: [name, kinds, guide]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        inspiration: { type: string, maxLength: 300, description: What the style draws on; for people, never shown on screen. }
        kinds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DeliverableKind" }
        guide: { type: string, maxLength: 20000, description: Markdown style guide. }
        palette:
          type: array
          maxItems: 8
          items: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        headingFont: { $ref: "#/components/schemas/TemplateFont" }
        bodyFont: { $ref: "#/components/schemas/TemplateFont" }
        musicMood: { type: string, maxLength: 300 }

    Template:
      type: object
      required: [id, name, description, inspiration, kinds, guide, palette, headingFont, bodyFont, musicMood, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        inspiration: { type: string }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/DeliverableKind" }
        guide: { type: string }
        palette:
          type: array
          items: { type: string }
        headingFont: { $ref: "#/components/schemas/TemplateFont" }
        bodyFont: { $ref: "#/components/schemas/TemplateFont" }
        musicMood: { type: string }
        source:
          type: string
          enum: [builtin, custom, generated]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SEOProfile:
      type: object
      required: [domain, country, language, topics]
      properties:
        domain: { type: string, description: "e.g. example.com" }
        country: { type: string, description: Two-letter code such as TR. }
        language: { $ref: "#/components/schemas/Language" }
        topics: { type: string, description: What to look for. }
        projectId: { type: string, description: The OpenSEO project direct refreshes are scoped to. }
        seeds:
          type: array
          maxItems: 5
          description: Seed keywords for research_keywords (about 54 credits each). Empty uses the topics.
          items: { type: string }
        competitors:
          type: array
          maxItems: 3
          description: Domains whose ranking keywords to mine (about 100–300 credits each).
          items: { type: string }
        maxDifficulty: { type: integer, minimum: 0, maximum: 100, description: "Keyword difficulty ceiling; 0 means 50." }
        minVolume: { type: integer, minimum: 0, description: Monthly searches floor. }
        estimatedCredits:
          type: integer
          readOnly: true
          description: The most a direct refresh with this profile should spend.

    OpenSEOProject:
      type: object
      required: [id, name, locationCode, languageCode]
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        locationCode: { type: integer }
        languageCode: { type: string }
        url: { type: string }
        organization: { type: string }

    OpenSEOStatus:
      type: object
      required: [configured, projects]
      properties:
        configured: { type: boolean, description: An API key is set. }
        email: { type: string }
        creditsRemaining: { type: number, format: double }
        projects:
          type: array
          items: { $ref: "#/components/schemas/OpenSEOProject" }
        error: { type: string }

    OpportunityStatus:
      type: string
      enum: [open, used, dismissed]

    OpportunityInput:
      type: object
      required: [keyword]
      properties:
        keyword: { type: string, maxLength: 120 }
        language: { $ref: "#/components/schemas/Language" }
        volume: { type: integer, minimum: 0 }
        difficulty: { type: integer, minimum: -1, maximum: 100 }
        intent: { type: string }
        note: { type: string, maxLength: 1000 }

    Opportunity:
      type: object
      required: [id, keyword, language, volume, difficulty, intent, note, source, status, score, createdAt]
      properties:
        id: { type: string, format: uuid }
        keyword: { type: string }
        language: { $ref: "#/components/schemas/Language" }
        volume: { type: integer }
        difficulty: { type: integer, description: "-1 when unknown" }
        intent: { type: string }
        note: { type: string }
        source: { type: string }
        status: { $ref: "#/components/schemas/OpportunityStatus" }
        storyId: { type: string, format: uuid }
        score: { type: number }
        createdAt: { type: string, format: date-time }

    WorkspaceInput:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string, maxLength: 80 }
        timezone:
          type: string
          description: IANA timezone name, e.g. Europe/Istanbul.

    WorkspacePatch:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        timezone: { type: string }

    Workspace:
      type: object
      required: [id, name, timezone, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        role:
          $ref: "#/components/schemas/Role"
          description: The caller's role in this workspace.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Language:
      type: string
      enum: [tr, en]

    DeliverableKind:
      type: string
      enum: [video, article]

    VideoSpec:
      type: object
      required: [format, orientation, durationSeconds]
      properties:
        format:
          type: string
          enum: [short, long]
        orientation:
          type: string
          enum: [vertical, horizontal, square]
        durationSeconds: { type: integer, minimum: 10, maximum: 3600 }

    ArticleSpec:
      type: object
      required: [words, translations]
      properties:
        words: { type: integer, minimum: 300, maximum: 6000 }
        translations:
          type: array
          items: { $ref: "#/components/schemas/Language" }

    Outputs:
      type: object
      description: >
        A video, an article, or both. With both, `lead` says which is
        produced first; the other is derived from it.
      properties:
        video: { $ref: "#/components/schemas/VideoSpec" }
        article: { $ref: "#/components/schemas/ArticleSpec" }
        lead: { $ref: "#/components/schemas/DeliverableKind" }

    KnowledgeRef:
      type: object
      required: [documentId]
      properties:
        documentId: { type: string, format: uuid }
        fromPage:
          type: integer
          minimum: 1
          description: Omit both pages for the whole document.
        toPage: { type: integer, minimum: 1 }

    Source:
      type: object
      required: [kind, instructions]
      properties:
        kind:
          type: string
          enum: [prompt, knowledge, seo]
          description: >
            prompt: ideas from the instructions. knowledge: ideas and facts from
            the referenced pages. seo: each idea targets one open keyword
            opportunity from the workspace's pool.
        instructions:
          type: string
          maxLength: 20000
          description: >
            Required for prompt sources, where it acts as the system prompt;
            optional guidance for knowledge sources.
        refs:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeRef" }

    Schedule:
      type: object
      required: [cron, timezone, batch]
      properties:
        cron:
          type: string
          description: Five-field cron expression or descriptor such as @daily.
        timezone:
          type: string
          description: IANA timezone the expression is evaluated in.
        batch:
          type: integer
          minimum: 1
          maximum: 20
          description: Items produced per run.

    PipelineDefinition:
      type: object
      required: [name, language, outputs, source]
      properties:
        name: { type: string, maxLength: 120 }
        language: { $ref: "#/components/schemas/Language" }
        outputs: { $ref: "#/components/schemas/Outputs" }
        source: { $ref: "#/components/schemas/Source" }
        schedule: { $ref: "#/components/schemas/Schedule" }
        templateId:
          type: string
          format: uuid
          description: House style for this pipeline's stories.
        voice: { $ref: "#/components/schemas/VoiceOverride" }

    Pipeline:
      type: object
      required: [id, workspaceId, version, status, definition, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        status:
          type: string
          enum: [active, paused]
        definition: { $ref: "#/components/schemas/PipelineDefinition" }
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      required: [id, workspaceId, traceId, queue, kind, status, attempt, maxAttempts, runAfter, createdAt, updatedAt, subject]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        traceId:
          type: string
          format: uuid
          description: The request this job belongs to (its first job's id); every job a request causes shares it.
        queue: { type: string }
        kind: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        runAfter: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt:
          type: string
          format: date-time
          description: When the latest attempt began; absent until the job first runs.
        finishedAt: { type: string, format: date-time }
        subject: { $ref: "#/components/schemas/JobSubject" }
    JobSubject:
      type: object
      description: What the job works on, as named in its payload.
      properties:
        storyId: { type: string, format: uuid }
        deliverableId: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        final: { type: boolean, description: A final (not preview) render. }
