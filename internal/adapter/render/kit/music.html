<!doctype html>
<meta charset="utf-8">
<title>ekin music</title>
<script src="/kit/tone.js"></script>
<script src="/music.js"></script>
<script>
// Renders music.js offline: music.js must define
//   window.ekinMusic = (Tone, { duration }) => { ...schedule on Tone.getTransport()... }
// It must not call Tone.start() or use the real-time context.
window.renderMusic = async function (duration, sampleRate) {
  if (typeof window.ekinMusic !== "function") throw new Error("music.js must define window.ekinMusic(Tone, { duration })");
  const buffer = await Tone.Offline(async ({ transport }) => {
    await window.ekinMusic(Tone, { duration });
    transport.start(0);
  }, duration, 2, sampleRate);
  const audio = buffer.get();
  return wavBase64(audio);
};

function wavBase64(audio) {
  const ch = audio.numberOfChannels, len = audio.length, rate = audio.sampleRate;
  const data = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) data.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); data.setUint32(4, 36 + len * ch * 2, true); str(8, "WAVE"); str(12, "fmt ");
  data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, ch, true);
  data.setUint32(24, rate, true); data.setUint32(28, rate * ch * 2, true); data.setUint16(32, ch * 2, true);
  data.setUint16(34, 16, true); str(36, "data"); data.setUint32(40, len * ch * 2, true);
  const chans = []; for (let c = 0; c < ch; c++) chans.push(audio.getChannelData(c));
  let o = 44, peak = 0;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) peak = Math.max(peak, Math.abs(chans[c][i]));
  const gain = peak > 0.98 ? 0.98 / peak : 1;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) {
    const s = Math.max(-1, Math.min(1, chans[c][i] * gain));
    data.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
  }
  const bytes = new Uint8Array(data.buffer);
  let bin = ""; const step = 0x8000;
  for (let i = 0; i < bytes.length; i += step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
  return { base64: btoa(bin), peak };
}
</script>
